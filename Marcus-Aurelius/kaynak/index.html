</style></head><body><canvas id="c" width="1080" height="1920"></canvas>

<script>
// Marcus Aurelius: "Okumadan yok etti". Canvas engine, frames are pure functions of time.
const W = 1080, H = 1920, FPS = 30, DUR = window.DATA.duration, FRAMES = Math.round(DUR * FPS);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const D = window.DATA, WD = D.words;
// Palette: Roman gold, deep crimson, midnight marble, cold Danube blue (fire against snow).

// ---------------- media ----------------
if (new URLSearchParams(location.search).has('eksik')) window.ALLOW_MISSING = true;
const IMG = {

  cassius: 'flow/ara-S02.jpg', tuna: 'flow/ara-S03.jpg', sandik: 'flow/ara-S05.jpg', heykel: 'flow/ara-S06.jpg', hadrian: 'flow/ara-S08.jpg', varis: 'flow/ara-S09.jpg',
  stoa: 'flow/ara-S10.jpg', terazi: 'flow/ara-S11.jpg', epiktetos: 'flow/ara-S12.jpg', notlar: 'flow/ara-S13.jpg', veba: 'flow/ara-S14.jpg', artirma: 'flow/ara-S15.jpg',
  kulube: 'flow/ara-S16.jpg', sutun: 'flow/ara-S17.jpg', kodeks: 'flow/ara-S23.jpg',

Object.assign(IMG, window.PICK || {});
// Veo key scenes unpacked to 30 fps JPEG frames: gorseller/klip/<name>/0001.jpg ... (veo.js: VEO_CLIPS = frame counts, VEO_SPEECH = speech start in the clip, s)
const CLIP = { ...(window.VEO_CLIPS || {}) };
const SPEECH = window.VEO_SPEECH || {};
// until a clip is unpacked the shot uses the Flow still it starts from
const VEO_FALLBACK = { v_s01: 's01', v_s04: 's04', v_s07: 's07', v_s18: 's18', v_s20: 's20', v_s21: 's21', v_s22: 's22' };
const G = {};
function loadImg(src) { return new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error('missing ' + src)); im.src = '../gorseller/' + src; }); }
const cache = new Map();
async function clipFrame(k, i) {

}
async function prep() {

  G.grain = [0, 1, 2, 3].map(s => { const c = document.createElement('canvas'); c.width = 540; c.height = 960; const x = c.getContext('2d'); const d = x.createImageData(540, 960); const r = rng(77 + s);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });

  const fb = document.createElement('canvas'); fb.width = 540; fb.height = 960; const fx = fb.getContext('2d'); fx.fillStyle = '#808080'; fx.fillRect(0, 0, 540, 960); const fr = rng(808);
  for (let i = 0; i < 2600; i++) { const x = fr() * 540, y = fr() * 960, l = 6 + fr() * 40, an = (fr() - 0.5) * 0.6 + (fr() < 0.5 ? 0 : 1.57); fx.strokeStyle = fr() < 0.5 ? 'rgba(40,30,20,0.25)' : 'rgba(255,245,225,0.25)'; fx.lineWidth = 0.6 + fr();
    fx.beginPath(); fx.moveTo(x, y); fx.lineTo(x + Math.cos(an) * l, y + Math.sin(an) * l); fx.stroke(); }

}
// cover-crop view (u,v = centre 0..1, z = zoom)
function drawImg(im, u, v, z, rot = 0, filter = 'none') {

  const s = Math.max(W / iw, H / ih) * z;

  const dw = iw * s, dh = ih * s; const ox = clamp(u * dw - W / 2, 0, dw - W), oy = clamp(v * dh - H / 2, 0, dh - H);

}

// ---------------- motion layers ----------------
const EMB = (() => { const r = rng(451), a = []; for (let i = 0; i < 150; i++) a.push({ x: r(), p: r(), s: r(), w: r() * 6.28 }); return a; })();
function embers(t, amt, cx = 0.5, spread = 0.9, y0 = 0.95, speed = 1) {
  if (amt <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'lighter';

    const x = (cx + (e.x - 0.5) * spread + Math.sin(t * 1.3 + e.w) * 0.05 * ph) * W, y = (y0 - ph * (0.55 + e.s * 0.5)) * H, r = 2 + e.s * 5;
    ctx.globalAlpha = amt * Math.sin(Math.PI * ph) * (0.55 + 0.45 * Math.sin(t * 11 + e.w * 3));
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3); g.addColorStop(0, 'rgba(255,228,170,1)'); g.addColorStop(0.3, 'rgba(255,140,50,0.85)'); g.addColorStop(1, 'rgba(255,70,10,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r * 3, y - r * 3, r * 6, r * 6); }
  ctx.restore();
}
const flick = t => 0.55 + 0.25 * Math.sin(t * 13.1) + 0.12 * Math.sin(t * 29.7 + 1.3) + 0.08 * Math.sin(t * 7.3 + 2.1);
function fireGlow(t, amt, cx = 0.5, cy = 1.0, rad = 1.1) {   // breathing warm light from a fire below
  ctx.save(); ctx.globalCompositeOperation = 'screen'; const k = amt * flick(t);
  const g = ctx.createRadialGradient(cx * W, cy * H, 0, cx * W, cy * H, rad * H); g.addColorStop(0, `rgba(255,150,60,${0.55 * k})`); g.addColorStop(0.5, `rgba(255,90,30,${0.18 * k})`); g.addColorStop(1, 'rgba(255,80,20,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function torch(t, amt) {    // flickering torchlight: warm wash that breathes, shadows that breathe darker
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = `rgba(${Math.round(150 + 60 * flick(t))},${Math.round(95 + 40 * flick(t + 0.3))},60,${0.35 * amt})`; ctx.fillRect(0, 0, W, H); ctx.restore();
  fireGlow(t, 0.6 * amt, 0.15, 0.35, 0.9);
}
const PUFFS = (() => { const r = rng(100), a = []; for (let i = 0; i < 90; i++) a.push({ x: r(), d: r(), p: r(), s: 0.6 + r() * 1.4, w: r() * 6.28 }); return a; })();
function smoke(t, amt, cx = 0.5, cy = 0.55, spread = 0.5, speed = 0.5) {
  if (amt <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const f of PUFFS) { const life = 3.2 / speed, ph = ((t / life + f.p) % 1);
    const y = (cy - ph * (0.75 + f.d * 0.3)) * H, x = (cx + (f.x - 0.5) * spread * (0.4 + ph * 1.4) + Math.sin(t * 0.9 + f.w) * 0.03 * ph) * W;
    const r = (80 + 260 * ph) * f.s; ctx.globalAlpha = amt * Math.sin(Math.PI * ph) * 0.6; ctx.drawImage(G.puff, x - r, y - r, r * 2, r * 2); }
  ctx.restore();
}
const MOTES = (() => { const r = rng(33), a = []; for (let i = 0; i < 130; i++) a.push({ x: r(), y: r(), s: r(), p: r() * 6.28 }); return a; })();
function motes(t, amt, col = '255,214,150', wind = 0.004) {
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const m of MOTES) { const x = ((m.x + Math.sin(t * 0.2 + m.p) * 0.03 + t * wind * (0.5 + m.s)) % 1 + 1) % 1 * W, y = ((m.y - t * 0.01 * (0.3 + m.s)) % 1 + 1) % 1 * H, r = 1.5 + m.s * 3.5;
    ctx.globalAlpha = amt * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 2 + m.p))); ctx.fillStyle = `rgb(${col})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
const STREAK = (() => { const r = rng(808), a = []; for (let i = 0; i < 70; i++) a.push({ y: r(), p: r(), s: r(), l: r() }); return a; })();
function dustStorm(t, amt) {   // wind-blown dust sweeping across the hill
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.filter = 'blur(14px)';   // soft drifting veils, never hard bars
  for (const d of STREAK) { const sp = 0.18 + d.s * 0.35, x = (((d.p + t * sp) % 1.4) - 0.2) * W, y = (0.35 + d.y * 0.65) * H + Math.sin(t * 2 + d.p * 9) * 18, l = 260 + d.l * 560, h = 30 + d.s * 70;
    const g = ctx.createLinearGradient(x - l, y, x, y); g.addColorStop(0, 'rgba(210,180,140,0)'); g.addColorStop(0.6, `rgba(220,190,150,${0.13 * amt * (0.4 + d.s)})`); g.addColorStop(1, 'rgba(220,190,150,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x - l / 2, y, l / 2, h / 2, 0, 0, 6.283); ctx.fill(); }
  ctx.filter = 'none'; ctx.restore(); motes(t, 0.6 * amt, '225,200,165', 0.03);
}
const ASH = (() => { const r = rng(55), a = []; for (let i = 0; i < 120; i++) a.push({ x: r(), p: r(), s: r(), w: r() * 6.28 }); return a; })();
function ash(t, amt) {
  ctx.save();
  for (const f of ASH) { const ph = ((t * (0.08 + f.s * 0.1) + f.p) % 1), x = (f.x + Math.sin(t * 0.8 + f.w) * 0.03) * W, y = ph * H, r = 2 + f.s * 6;
    ctx.globalAlpha = amt * (0.35 + 0.5 * f.s); ctx.fillStyle = f.s > 0.8 ? 'rgba(255,150,70,1)' : 'rgba(190,185,180,1)';
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * (1 + f.s * 3) + f.w); ctx.fillRect(-r, -r * 0.4, r * 2, r * 0.8); ctx.restore(); }
  ctx.restore();
}
const CHIPS = (() => { const r = rng(96), a = []; for (let i = 0; i < 40; i++) a.push({ a: r(), v: r(), s: r() }); return a; })();
function chips(t, amt, cx = 0.5, cy = 0.55, period = 0.9) {   // stone chips jumping at every flint strike
  const lt = t % period; ctx.save();
  for (const c of CHIPS) { const ang = -Math.PI / 2 + (c.a - 0.5) * 2.4, sp = 500 + c.v * 900, x = cx * W + Math.cos(ang) * sp * lt, y = cy * H + Math.sin(ang) * sp * lt + 1400 * lt * lt;

const LIGHTS = (() => { const r = rng(1848), a = []; for (let i = 0; i < 260; i++) a.push({ x: r(), y: 0.45 + r() * 0.5, on: r(), s: r() }); return a; })();
function cityLights(t, k) {
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const L of LIGHTS) { if (L.on > k) continue; const fl = 0.75 + 0.25 * Math.sin(t * 7 + L.s * 40); const x = L.x * W, y = L.y * H, r = 8 + L.s * 20;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(255,214,140,${0.85 * fl})`); g.addColorStop(1, 'rgba(255,180,90,0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
  ctx.restore();
}
function godRays(t, amt, cx = 0.75, cy = 0.02) {
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.translate(cx * W, cy * H);
  for (let i = 0; i < 7; i++) { const a = 0.35 + i * 0.13 + Math.sin(t * 0.3 + i) * 0.03; const g = ctx.createLinearGradient(0, 0, Math.cos(a + 1.2) * 1800, Math.sin(a + 1.2) * 1800);
    g.addColorStop(0, `rgba(255,205,130,${0.15 * amt})`); g.addColorStop(1, 'rgba(255,205,130,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a + 1.2 - 0.04) * 2200, Math.sin(a + 1.2 - 0.04) * 2200); ctx.lineTo(Math.cos(a + 1.2 + 0.04) * 2200, Math.sin(a + 1.2 + 0.04) * 2200); ctx.fill(); }
  ctx.restore();
}
// 3D sky: a star sphere with a Milky Way band, turning slowly, projected through a pinhole camera
const STARS = (() => { const r = rng(9600), a = [];
  for (let i = 0; i < 1500; i++) { const th = r() * 6.283, ph = Math.acos(2 * r() - 1); a.push({ x: Math.sin(ph) * Math.cos(th), y: Math.cos(ph), z: Math.sin(ph) * Math.sin(th), m: r(), b: 0 }); }
  for (let i = 0; i < 2600; i++) { const th = r() * 6.283, ph = Math.PI / 2 + (r() + r() + r() - 1.5) * 0.16; a.push({ x: Math.sin(ph) * Math.cos(th), y: Math.cos(ph), z: Math.sin(ph) * Math.sin(th), m: r() * 0.7, b: 1 }); }
  return a; })();
function stars(t, amt, pitch = 0.35, horizon = 0.62, yaw0 = 0) {
  const yaw = yaw0 + t * 0.012, cy = Math.cos(yaw), sy = Math.sin(yaw), roll = 0.75, cr = Math.cos(roll), sr = Math.sin(roll), cp = Math.cos(pitch), sp = Math.sin(pitch), f = 820;

    const fade = clamp((H * horizon - py) / 160, 0, 1), tw = 0.65 + 0.35 * Math.sin(t * (2 + s.m * 3) + s.m * 50), r = (s.b ? 1.1 : 1.6) + s.m * 2.2;

// ---------------- text ----------------
const SNW = (() => { const r = rng(913), a = []; for (let i = 0; i < 260; i++) a.push({ x: r(), y: r(), z: r(), w: r() * 6.28 }); return a; })();
function snow(t, amt, wind = 0.05) {   // three depths of falling snow, near flakes larger and faster
  if (amt <= 0) return; ctx.save(); ctx.fillStyle = 'rgba(235,242,255,0.9)';
  for (const p of SNW) { const sp = 0.05 + p.z * 0.16; const y = ((p.y + t * sp) % 1.1) - 0.05; const x = ((p.x + t * wind * (0.5 + p.z) + 0.02 * Math.sin(t * 1.3 + p.w)) % 1 + 1) % 1;

  if (amt <= 0) return; ctx.save(); const r = rng(55);
  for (let i = 0; i < 26; i++) { const x = ((r() + t * 0.012 * (0.5 + r())) % 1.4) - 0.2, y = 0.45 + r() * 0.55, sz = 500 + r() * 700;

function cardText(lines, lt, { y = 520, size = 130, color = CREAM, sub = null, subColor = GOLD, font = 'Anton', fade = 0.3, band = 0.42, slam = false } = {}) {

  ctx.translate(W / 2, y); ctx.scale(sc, sc);
