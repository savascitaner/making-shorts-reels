<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Marcus Aurelius kapak</title>
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Cinzel;font-weight:900;src:url(fonts/cinzel-latin-900.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cinzel;font-weight:900;src:url(fonts/cinzel-latin-ext-900.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF}
@font-face{font-family:Cinzel;font-weight:700;src:url(fonts/cinzel-latin-700.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cinzel;font-weight:700;src:url(fonts/cinzel-latin-ext-700.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF}
@font-face{font-family:Alegreya Sans;font-weight:800;src:url(fonts/alegreya-sans-latin-800.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Alegreya Sans;font-weight:800;src:url(fonts/alegreya-sans-latin-ext-800.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF}
html,body{margin:0;background:#000}canvas{display:block;width:360px;height:640px}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const GOLD = '#D9B44A', CREAM = '#F4ECDC';
const BG = new URLSearchParams(location.search).get('bg') || 'flow/veo-S01.jpg';
function load(src) { return new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error(src)); im.src = '../gorseller/' + src; }); }
function cover(im, u, v, z) { const s = Math.max(W / im.width, H / im.height) * z, dw = im.width * s, dh = im.height * s; ctx.drawImage(im, -Math.max(0, Math.min(dw - W, u * dw - W / 2)), -Math.max(0, Math.min(dh - H, v * dh - H / 2)), dw, dh); }
function txt(s, x, y, font, fill, lw, align = 'center', glow = 0) { ctx.font = font;
  const mw = ctx.measureText(s).width; if (mw > 980) { const px = +font.match(/(\d+)px/)[1]; font = font.replace(/\d+px/, Math.floor(px * 980 / mw) + 'px'); lw = lw * 980 / mw; ctx.font = font; } ctx.textAlign = align; ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = 'rgba(8,6,4,0.95)'; ctx.strokeText(s, x, y); if (glow) { ctx.shadowColor = 'rgba(255,150,50,0.75)'; ctx.shadowBlur = glow; } ctx.fillStyle = fill; ctx.fillText(s, x, y); ctx.shadowBlur = 0; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function yt(x, y, s) { ctx.fillStyle = '#FF0033'; rr(x - s * 0.71, y - s / 2, s * 1.42, s, s * 0.28); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - s * 0.17, y - s * 0.24); ctx.lineTo(x + s * 0.27, y); ctx.lineTo(x - s * 0.17, y + s * 0.24); ctx.fill(); }
function ig(x, y, s) { const g = ctx.createLinearGradient(x - s / 2, y + s / 2, x + s / 2, y - s / 2); g.addColorStop(0, '#F9CE34'); g.addColorStop(0.5, '#EE2A7B'); g.addColorStop(1, '#6228D7'); ctx.strokeStyle = g; ctx.lineWidth = s * 0.11; rr(x - s / 2, y - s / 2, s, s, s * 0.28); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y, s * 0.22, 0, 6.283); ctx.stroke(); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x + s * 0.26, y - s * 0.26, s * 0.06, 0, 6.283); ctx.fill(); }
function web(x, y, s) { ctx.strokeStyle = GOLD; ctx.lineWidth = s * 0.08; ctx.beginPath(); ctx.arc(x, y, s / 2, 0, 6.283); ctx.stroke(); ctx.beginPath(); ctx.ellipse(x, y, s * 0.22, s / 2, 0, 0, 6.283); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - s / 2, y); ctx.lineTo(x + s / 2, y); ctx.stroke(); }
function seal(x, y, r, glyph, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); for (let i = 0; i <= 64; i++) { const an = i / 64 * 6.283; const rr = r * (1 + 0.06 * Math.sin(an * 5 + 1.3) + 0.035 * Math.sin(an * 11 + 0.4)); ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r * 1.1); g.addColorStop(0, '#C9353A'); g.addColorStop(0.55, '#9E1B1F'); g.addColorStop(1, '#4E080B');
  ctx.fillStyle = g; ctx.shadowColor = 'rgba(0,0,0,0.65)'; ctx.shadowBlur = r * 0.4; ctx.shadowOffsetY = r * 0.14; ctx.fill(); ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  for (const [off, col] of [[2.5, 'rgba(40,0,0,0.75)'], [-2, 'rgba(255,170,160,0.35)']]) { ctx.strokeStyle = col; ctx.lineWidth = r * 0.06; ctx.beginPath(); ctx.arc(off, off, r * 0.72, 0, 6.283); ctx.stroke(); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 ${Math.round(r * 0.8)}px Cinzel`;
  ctx.fillStyle = 'rgba(40,0,0,0.8)'; ctx.fillText(glyph, 3, 5); ctx.fillStyle = 'rgba(255,175,165,0.45)'; ctx.fillText(glyph, -2, 0); ctx.fillStyle = '#7E1216'; ctx.fillText(glyph, 0, 2);
  ctx.restore();
}
function carved(txt, y, size, gold) {   // chiselled inscription: dark cut, drop shadow, gold or cream face, top highlight
  ctx.save(); ctx.textAlign = 'center'; ctx.lineJoin = 'round'; let sz = size; ctx.font = `900 ${sz}px Cinzel`; const mw = ctx.measureText(txt).width; if (mw > 980) { sz = Math.floor(sz * 980 / mw); ctx.font = `900 ${sz}px Cinzel`; }
  ctx.lineWidth = sz * 0.13; ctx.strokeStyle = 'rgba(6,4,4,0.95)'; ctx.strokeText(txt, W / 2, y); ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillText(txt, W / 2 + 4, y + 5);
  let f = '#F4ECDC'; if (gold) { f = ctx.createLinearGradient(0, y - sz * 0.8, 0, y); f.addColorStop(0, '#F7E4A2'); f.addColorStop(0.55, '#D9B44A'); f.addColorStop(1, '#9C7424'); }
  if (gold) { ctx.shadowColor = 'rgba(255,150,50,0.6)'; ctx.shadowBlur = 40; } ctx.fillStyle = f; ctx.fillText(txt, W / 2, y); ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,250,235,0.25)'; ctx.fillText(txt, W / 2 - 2, y - 2); ctx.restore();
}
async function draw() {
  const im = await load(BG); cover(im, 0.5, 0.4, 1.08);
  let g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(5,4,3,0.35)'); g.addColorStop(0.22, 'rgba(5,4,3,0.0)'); g.addColorStop(0.45, 'rgba(5,4,3,0.2)'); g.addColorStop(0.62, 'rgba(5,4,3,0.65)'); g.addColorStop(1, 'rgba(5,4,3,0.92)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.8); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 4:5 safe band y 285..1635, no addresses
  carved('HAİNLERİN LİSTESİ', 1000, 104, false);
  carved('ELİNDEYDİ', 1120, 104, false);
  carved('OKUMADI.', 1345, 200, true);
  seal(700, 830, 74, 'M', -0.25);
  ctx.save(); ctx.textAlign = 'center'; ctx.font = '700 46px Cinzel'; ctx.letterSpacing = '14px'; ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(6,4,4,0.9)'; ctx.strokeText('MARCUS AURELIUS', W / 2 + 7, 1520); ctx.fillStyle = '#F4ECDC'; ctx.fillText('MARCUS AURELIUS', W / 2 + 7, 1520); ctx.restore();
  ctx.fillStyle = '#9E1B1F'; ctx.fillRect(W / 2 - 120, 1552, 240, 5);
}
window.READY = (async () => { await Promise.all(['150px Anton', '700 40px Cinzel', '900 40px Cinzel', '800 40px "Alegreya Sans"'].map(f => document.fonts.load(f, 'ŞİĞÜÖÇışğüöç'))); await draw(); return { frames: 1, fps: 1, width: W, height: H, renderer: 'canvas' }; })();
window.captureFrame = (f, type = 'image/png', q = 0.95) => cv.toDataURL(type, q);
</script></body></html>
