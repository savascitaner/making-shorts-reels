<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Kapak</title>
<style>
@font-face{font-family:Cinzel;font-weight:900;src:url(fonts/cinzel-latin-900.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cinzel;font-weight:900;src:url(fonts/cinzel-latin-ext-900.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF}
@font-face{font-family:Cinzel;font-weight:700;src:url(fonts/cinzel-latin-700.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cinzel;font-weight:700;src:url(fonts/cinzel-latin-ext-700.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF}
@font-face{font-family:Alegreya Sans;font-weight:800;src:url(fonts/alegreya-sans-latin-800.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Alegreya Sans;font-weight:800;src:url(fonts/alegreya-sans-latin-ext-800.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF}
@font-face{font-family:Alegreya Sans;font-weight:500;src:url(fonts/alegreya-sans-latin-500.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Alegreya Sans;font-weight:500;src:url(fonts/alegreya-sans-latin-ext-500.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF}
html,body{margin:0;background:#000}canvas{display:block;width:360px;height:640px}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Covers ?v=a|b|c  (1080x1920; title block sits inside the 1:1 centre crop, y 420-1500). No signature.
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const V = new URLSearchParams(location.search).get('v') || 'a';
const GOLD = '#E8C06A', CREAM = '#F3E7CF', EMBER = '#E2683C';
const load = s => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(s); i.src = '../gorseller/secilen/' + s; });
function cover(im, u, v, z, filter) { const s = Math.max(W / im.width, H / im.height) * z, w = W / s, h = H / s;
  ctx.filter = filter; ctx.drawImage(im, Math.max(0, Math.min(im.width - w, u * im.width - w / 2)), Math.max(0, Math.min(im.height - h, v * im.height - h / 2)), w, h, 0, 0, W, H); ctx.filter = 'none'; }
function vignette(k) { const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.22, W / 2, H / 2, H * 0.72); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${k})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function band(y0, y1, k) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, 'rgba(4,3,3,0)'); g.addColorStop(0.3, `rgba(4,3,3,${k})`); g.addColorStop(0.7, `rgba(4,3,3,${k})`); g.addColorStop(1, 'rgba(4,3,3,0)'); ctx.fillStyle = g; ctx.fillRect(0, y0, W, y1 - y0); }
function big(lines, y, size, fill, lh = 1.0) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  lines.forEach((s, i) => { let sz = size; ctx.font = `900 ${sz}px Cinzel`; const w = ctx.measureText(s).width; if (w > 990) { sz = Math.floor(sz * 990 / w); ctx.font = `900 ${sz}px Cinzel`; }
    const yy = y + i * size * lh; ctx.lineWidth = sz * 0.09; ctx.strokeStyle = 'rgba(5,3,2,0.9)'; ctx.strokeText(s, W / 2, yy);
    ctx.fillStyle = typeof fill === 'function' ? fill(yy, sz) : fill; ctx.shadowColor = 'rgba(232,192,106,0.5)'; ctx.shadowBlur = 36; ctx.fillText(s, W / 2, yy); ctx.shadowBlur = 0; });
}
const goldGrad = (yy, sz) => { const g = ctx.createLinearGradient(0, yy - sz, 0, yy); g.addColorStop(0, '#fff1c9'); g.addColorStop(0.55, GOLD); g.addColorStop(1, '#b8873a'); return g; };
function small(s, y, color = CREAM, size = 54, weight = 500) { ctx.font = `${weight} ${size}px "Alegreya Sans"`; ctx.textAlign = 'center'; ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(5,3,2,0.85)'; ctx.strokeText(s, W / 2, y); ctx.fillStyle = color; ctx.fillText(s, W / 2, y); }
function kicker(s, y) { ctx.font = '700 40px Cinzel'; ctx.textAlign = 'center'; ctx.fillStyle = GOLD; ctx.fillText(s, W / 2, y); ctx.fillRect(W / 2 - 70, y + 24, 140, 3); }
async function draw() {
  await Promise.all(['900 40px Cinzel', '700 40px Cinzel', '500 40px "Alegreya Sans"', '800 40px "Alegreya Sans"'].map(f => document.fonts.load(f, 'ŞİĞÜÖÇışğüöç')));
  if (V === 'a') { // Torino AI painting, title "ATIN BOYNUNDAKİ FİLOZOF"
    const im = await load('ILLUSTRASYON-torino-AI-1.jpg'); cover(im, 0.59, 0.347, 1.6, 'brightness(0.8) contrast(1.1)');
    band(300, 1180, 0.62); kicker('3 OCAK 1889 · TORİNO', 470);
    big(['ATIN', 'BOYNUNDAKİ', 'FİLOZOF'], 640, 142, goldGrad, 1.07);
    small('“Tanrı öldü” diyen adam neden ağladı?', 1035); }
  if (V === 'b') { // 1882 portrait, "TANRI ÖLDÜ."
    const im = await load('04-portre-1882-schultze.jpg'); cover(im, 0.5, 0.42, 1.12, 'grayscale(1) sepia(0.45) contrast(1.2) brightness(0.62)');
    ctx.fillStyle = 'rgba(20,8,2,0.25)'; ctx.fillRect(0, 0, W, H); band(600, 1400, 0.6); kicker('FRIEDRICH NIETZSCHE', 700);
    big(['TANRI', 'ÖLDÜ.'], 930, 230, goldGrad, 1.0);
    small('Ama devamını kimse okumadı.', 1270, CREAM, 56); }
  if (V === 'c') { // Munch 1906, the question
    const im = await load('22-munch-1906-nietzsche.jpg'); cover(im, 0.55, 0.62, 1.25, 'contrast(1.08) saturate(0.85) brightness(0.62)');
    band(640, 1460, 0.6); kicker('NIETZSCHE’NİN SORUSU', 760);
    big(['BU HAYATI', 'TEKRAR', 'YAŞAR', 'MIYDIN?'], 950, 136, (yy, sz) => yy > 1200 ? EMBER : CREAM, 1.05); }
  vignette(0.55);
}
window.READY = draw().then(() => ({ frames: 1, fps: 30, width: W, height: H, renderer: '2d' }));
window.captureFrame = () => cv.toDataURL('image/png');
</script></body></html>
