<script>
// Sol Beyin Ego: tek motor, iki biçim. ?m=long (1920x1080) | ?m=short (1080x1920, sesin içinden kesilmiş).
// Imza: sol yarim sicak amber (hikaye anlatan sol beyin), sag yarim soguk camgobegi (sessiz sag beyin);
// bolum gecisleri ekranin ortadan iki yarimkure gibi ayrilmasi ("seam").
const Q = new URLSearchParams(location.search), MODE = Q.get('m') || 'long', SHORT = MODE === 'short';
const W = SHORT ? 1080 : 1920, H = SHORT ? 1920 : 1080, FPS = 24;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
const D = window.DATA, WD = D.words, AEND = D.duration;          // ses sonu (uzun)
const S = window.SHORTCUT || { segs: [], dur: 0 };
const TAIL = 9.5;                                                 // kapanis kartlari (ses bittikten sonra)
const DUR = (SHORT ? S.dur : AEND) + TAIL, FRAMES = Math.round(DUR * FPS);
const AMBER = '#F2B04A', CYAN = '#7FD6E6', CREAM = '#F6EEDC', INK = 'rgba(8,8,14,0.92)';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x)), ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const IDX = w => { const i = WD.findIndex(x => x.w.replace(/[.,:;?!]/g, '') === w); if (i < 0) throw new Error('kelime yok: ' + w); return i; };
const wt = i => WD[i].s;

// kisa video zamani -> uzun video zamani (ses kesitleri)
function longT(t) {
  if (!SHORT) return t;
  for (const [ls, le, ss] of S.segs) if (t >= ss && t < ss + (le - ls)) return ls + (t - ss);
  if (t >= S.dur) return AEND + (t - S.dur);
  const last = S.segs.filter(s => s[2] <= t).pop(); return last ? last[1] : 0;
}

// ---------------- gorseller ----------------
const IMGS = ['s01-ayna','s02-goz','s03-album','s04-ilmek','s05-projektor','s06-kaza','s07-mr','s08-lab','s09-model','s10-ameliyat','s11-adalar','s12-ekran','s13-kar','s13b-tavuk','s14-kartlar','s15-aciklama','s16-kumes','s17-daktilo','s18-bebek','s19-bebek-gulus','s20-aile','s21-okul','s22-unvan','s23-guvensiz','s24-noron','s25-gunluk','s26-acil','s27-korteks','s28-yatak','s29-uyanis','s30-goz-acilis','s31-beyinsapi','s32-bebek-el','s33-iyilesme','s34-cocuklar','s35-pencere','s36-tepe','s37-ayna-son'];
// Veo klipleri: [klasor, kullanilan ilk kare, son kare]
const CLIPS = { v1: ['v1-ayna', 1, 188], v2: ['v2-lab', 1, 188], v3: ['v3-kartlar', 1, 100], v4: ['v4-noron', 1, 188], v5: ['v5-uyanis', 1, 188], v6: ['v6-tepe', 1, 188] };
const G = {}, CF = {};
const load = src => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error('yuklenemedi ' + src)); im.src = src; });
async function prep() {
  window.MISSING = [];
  await Promise.all(IMGS.map(async k => { G[k] = await load('../gorseller/img/' + k + '.jpg').catch(() => {
    if (!Q.has('taslak')) throw new Error('eksik gorsel ' + k);       // final render'da eksik gorsel kabul edilmez
    window.MISSING.push(k); const c = document.createElement('canvas'); c.width = 1920; c.height = 1080; const x = c.getContext('2d'); x.fillStyle = '#333'; x.fillRect(0, 0, 1920, 1080); x.fillStyle = '#fff'; x.font = '80px sans-serif'; x.fillText(k, 100, 540); return c; }); }));
  G.logo = await load('../gorseller/kanal-logo.png');
  try { G.kapak = await load(SHORT ? 'kapak-916.png' : 'kapak.png'); } catch (e) { G.kapak = null; }
  for (const [k, [dir, a, b]] of Object.entries(CLIPS)) {
    CF[k] = []; const jobs = [];
    for (let i = a; i <= b; i++) jobs.push(load(`../gorseller/klip/${dir}/${String(i).padStart(4, '0')}.jpg`).then(im => { CF[k][i - a] = im; }));
    await Promise.all(jobs);
  }
  G.grain = [0, 1, 2].map(s => { const c = document.createElement('canvas'); c.width = 480; c.height = 480; const x = c.getContext('2d'); const d = x.createImageData(480, 480); const r = rng(11 + s);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });
}
// kapla-kirp; u,v = odak (0..1), z = yakinlik
function drawCover(im, u, v, z, filter) {
  const iw = im.width, ih = im.height, s = Math.max(W / iw, H / ih) * z, dw = iw * s, dh = ih * s;
  const ox = clamp(u * dw - W / 2, 0, dw - W), oy = clamp(v * dh - H / 2, 0, dh - H);
  if (filter) ctx.filter = filter; ctx.drawImage(im, -ox, -oy, dw, dh); ctx.filter = 'none';
}

// ---------------- plan listesi ----------------
// [kelime, kaynak, [u,v,z] bas, [u,v,z] son, efekt]   (u: 9:16 kirpimda yatay odak)
const SH = [
  [0, 'v1', [0.52, 0.5, 1.0], [0.55, 0.5, 1.0], 'clip'],
  ['savunduğunuz', 's02-goz', [0.5, 0.5, 1.15], [0.5, 0.5, 1.35], ''],

  ['köprü', 's09-model', [0.5, 0.5, 1.4], [0.5, 0.5, 1.75], ''],
  ['Böylece', 's11-adalar', [0.5, 0.5, 1.2], [0.5, 0.5, 1.0], 'mist'],
  [134, 's08-lab', [0.35, 0.5, 1.0], [0.4, 0.5, 1.15], ''],
  [140, 's09-model', [0.7, 0.5, 1.35], [0.66, 0.5, 1.55], ''],
  ['Hastanın', 's12-ekran', [0.5, 0.5, 1.0], [0.5, 0.45, 1.15], ''],
  [161, 's13-kar', [0.5, 0.5, 1.05], [0.5, 0.5, 1.2], 'snow'],
  [169, 's13b-tavuk', [0.5, 0.5, 1.2], [0.5, 0.5, 1.05], ''],
  ['Sonra', 's14-kartlar', [0.5, 0.65, 1.0], [0.5, 0.7, 1.15], ''],
  [182, 'v3', [0.4, 0.5, 1.0], [0.4, 0.5, 1.0], 'clip'],

  ['Konuşan', 's15-aciklama', [0.55, 0.45, 1.05], [0.6, 0.45, 1.25], ''],
  ['Anında', 's16-kumes', [0.5, 0.55, 1.15], [0.5, 0.5, 1.0], 'snow'],
  [234, 's17-daktilo', [0.5, 0.5, 1.0], [0.5, 0.55, 1.3], 'dust'],
  ['eldeki', 's05-projektor', [0.4, 0.45, 1.35], [0.38, 0.42, 1.55], 'beam'],
  [258, 's18-bebek', [0.5, 0.5, 1.15], [0.5, 0.5, 1.0], 'seam'],

  [305, 's23-guvensiz', [0.5, 0.5, 1.05], [0.52, 0.48, 1.25], ''],
  [309, 's22-unvan', [0.5, 0.45, 1.25], [0.5, 0.45, 1.05], ''],
  [317, 's25-gunluk', [0.5, 0.5, 1.0], [0.5, 0.55, 1.2], 'dust'],
  ['Sınırlarımızı', 's03-album', [0.5, 0.45, 1.35], [0.55, 0.5, 1.6], ''],
  [337, 'v4', [0.5, 0.5, 1.0], [0.5, 0.5, 1.0], 'clip'],
  [348, 's06-kaza', [0.5, 0.5, 1.0], [0.5, 0.5, 1.2], 'seam'],
  ['Şiddetli', 's26-acil', [0.5, 0.5, 1.0], [0.5, 0.5, 1.3], 'flash'],
  [361, 's28-yatak', [0.5, 0.5, 1.15], [0.5, 0.45, 1.0], ''],
  ['Çünkü', 's27-korteks', [0.5, 0.5, 1.0], [0.5, 0.5, 1.2], ''],
  ['Evrimsel', 's27-korteks', [0.4, 0.4, 1.5], [0.38, 0.38, 1.7], ''],
  [411, 's28-yatak', [0.5, 0.45, 1.4], [0.5, 0.42, 1.6], ''],
  [417, 's03-album', [0.5, 0.5, 1.0], [0.5, 0.5, 1.15], 'fade'],
  [428, 'v5', [0.6, 0.5, 1.0], [0.6, 0.5, 1.0], 'clip'],
  ['Antonio', 's31-beyinsapi', [0.5, 0.5, 1.2], [0.5, 0.5, 1.0], 'glow'],
  [459, 's35-pencere', [0.5, 0.5, 1.0], [0.5, 0.5, 1.15], 'dust'],
  [469, 's32-bebek-el', [0.5, 0.5, 1.2], [0.5, 0.5, 1.0], ''],
  [476, 's18-bebek', [0.5, 0.45, 1.4], [0.5, 0.45, 1.6], ''],
  [483, 's33-iyilesme', [0.5, 0.5, 1.15], [0.55, 0.5, 1.0], 'seam'],
  [501, 's34-cocuklar', [0.5, 0.5, 1.0], [0.5, 0.5, 1.2], ''],
  [517, 's05-projektor', [0.45, 0.5, 1.0], [0.45, 0.5, 1.2], 'beam'],
  [532, 's01-ayna', [0.55, 0.5, 1.0], [0.6, 0.48, 1.25], ''],
  [542, 's37-ayna-son', [0.5, 0.5, 1.2], [0.52, 0.48, 1.0], ''],
  [553, 'v6', [0.5, 0.5, 1.0], [0.5, 0.5, 1.0], 'clip seam'],
];
const SHOTS = SH.map((s, i) => ({ t0: i === 0 ? 0 : wt(typeof s[0] === 'number' ? s[0] : IDX(s[0])) - 0.1, k: s[1], a: s[2], b: s[3], fx: s[4] }));
SHOTS.forEach((s, i) => s.t1 = i + 1 < SHOTS.length ? SHOTS[i + 1].t0 : AEND + TAIL);

// ---------------- hareket katmanlari ----------------
const PTS = (() => { const r = rng(7), a = []; for (let i = 0; i < 140; i++) a.push({ x: r(), y: r(), s: r(), p: r() * 6.28 }); return a; })();
function dust(t, amt, col = '255,214,150') {
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const m of PTS) { const x = (((m.x + Math.sin(t * 0.15 + m.p) * 0.02 + t * 0.003 * (m.s - 0.5)) % 1) + 1) % 1 * W, y = (((m.y - t * 0.008 * (0.3 + m.s)) % 1) + 1) % 1 * H, r = (1.2 + m.s * 3) * (W / 1920 + 0.3);
    ctx.globalAlpha = amt * (0.25 + 0.6 * (0.5 + 0.5 * Math.sin(t * 1.7 + m.p))); ctx.fillStyle = `rgb(${col})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
function snow(t, amt) {
  ctx.save(); ctx.fillStyle = '#EAF4FF';
  for (const m of PTS) { const sp = 0.05 + m.s * 0.09, x = (((m.x + t * 0.02 + Math.sin(t + m.p) * 0.01) % 1) + 1) % 1 * W, y = ((m.y + t * sp) % 1) * H, r = 1 + m.s * 3.2;
    ctx.globalAlpha = amt * (0.35 + 0.5 * m.s); ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
function beam(t, amt) {   // projektor huzmesinde titresim
  const fl = 0.85 + 0.15 * Math.sin(t * 23) * Math.sin(t * 7.3);
  ctx.save(); ctx.globalCompositeOperation = 'screen'; const g = ctx.createRadialGradient(W * 0.3, H * 0.3, 0, W * 0.3, H * 0.3, W * 0.6);
  g.addColorStop(0, `rgba(255,205,140,${0.12 * amt * fl})`); g.addColorStop(1, 'rgba(255,205,140,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); dust(t, amt * 0.8);
}
function glow(t, amt) { ctx.save(); ctx.globalCompositeOperation = 'screen'; const p = 0.75 + 0.25 * Math.sin(t * 2.2);
  ctx.translate(W / 2, H / 2); ctx.scale(1, H > W ? 1.6 : 0.8); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, W * 0.35); g.addColorStop(0, `rgba(255,190,90,${0.28 * amt * p})`); g.addColorStop(1, 'rgba(255,190,90,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, W * 0.35, 0, 6.283); ctx.fill(); ctx.restore(); }

function drawShot(s, T) {
  const lt = T - s.t0, d = s.t1 - s.t0, e = ease((lt + 0.4) / (d + 0.8));
  let u = lerp(s.a[0], s.b[0], e), v = lerp(s.a[1], s.b[1], e), z = lerp(s.a[2], s.b[2], e);
  if (!SHORT) u = 0.5 + (u - 0.5) * 0.35;           // genis biçimde yatay kaymayi kis
  let filt = '';
  if (s.fx.includes('fade')) { const k = ease(lt / d); filt = `saturate(${lerp(1, 0.05, k)}) brightness(${lerp(1, 0.55, k)}) blur(${lerp(0, 3, k)}px)`; }
  if (s.k[0] === 'v') { const fr = CF[s.k], n = fr.length; let i = Math.floor(lt * FPS); if (i >= n) i = n - 1 - ((i - n) % 1); drawCover(fr[clamp(i, 0, n - 1)], u, v, z, filt); }
  else drawCover(G[s.k], u, v, z, filt);
  if (s.fx.includes('dust')) dust(T, 0.7);
  if (s.fx.includes('snow')) snow(T, 0.9);
  if (s.fx.includes('beam')) beam(T, 1);
  if (s.fx.includes('glow')) glow(T, 1);
  if (s.fx.includes('mist')) { ctx.save(); ctx.globalAlpha = 0.18 + 0.06 * Math.sin(T * 0.6); ctx.translate(W / 2 + Math.sin(T * 0.2) * W * 0.05, H * 0.55); ctx.scale(1, 0.3);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, W * 0.6); g.addColorStop(0, '#dfe8ee'); g.addColorStop(1, 'rgba(223,232,238,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, W * 0.6, 0, 6.283); ctx.fill(); ctx.restore(); }
  if (s.fx.includes('flash') && lt < 0.35) { ctx.fillStyle = `rgba(255,245,235,${0.7 * (1 - lt / 0.35)})`; ctx.fillRect(0, 0, W, H); }
}

// ---------------- imza: iki yarimkure isik tonu + seam gecisi ----------------
function hemiGrade() {
  ctx.save(); ctx.globalCompositeOperation = 'soft-light';
  const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, 'rgba(242,150,60,0.32)'); g.addColorStop(0.5, 'rgba(128,128,128,0)'); g.addColorStop(1, 'rgba(70,170,200,0.30)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
}
const SCR = document.createElement('canvas'); SCR.width = W; SCR.height = H; const sx = SCR.getContext('2d');
function composite(T) {
  let i = SHOTS.findIndex(s => T >= s.t0 && T < s.t1); if (i < 0) i = SHOTS.length - 1;
  const s = SHOTS[i]; drawShot(s, T);
  if (i > 0) {
    const lt = T - s.t0, seam = s.fx.includes('seam'), dur = seam ? 0.9 : 0.45;
    if (lt < dur) {
      sx.setTransform(1, 0, 0, 1, 0, 0); sx.drawImage(cv, 0, 0); drawShot(SHOTS[i - 1], T);
      const k = ease(lt / dur);
      if (seam) {   // eski plan ortadan ikiye ayrilip iki yana cekilir, arada amber/camgobegi ince isik
        const old = document.createElement('canvas'); old.width = W; old.height = H; old.getContext('2d').drawImage(cv, 0, 0);
        ctx.drawImage(SCR, 0, 0); const off = k * W * 0.5;
        ctx.drawImage(old, 0, 0, W / 2, H, -off, 0, W / 2, H); ctx.drawImage(old, W / 2, 0, W / 2, H, W / 2 + off, 0, W / 2, H);
        ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = Math.sin(Math.PI * k);
        ctx.fillStyle = AMBER; ctx.fillRect(W / 2 - off - 3, 0, 3, H); ctx.fillStyle = CYAN; ctx.fillRect(W / 2 + off, 0, 3, H); ctx.restore();
      } else { ctx.globalAlpha = k; ctx.drawImage(SCR, 0, 0); ctx.globalAlpha = 1; }
    }
  }
}

// ---------------- yazilar ----------------
function stroked(txt, x, y, font, fill, lw, glowC) {
  ctx.font = font; ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.strokeText(txt, x, y);
  if (glowC) { ctx.shadowColor = glowC; ctx.shadowBlur = lw * 3; } ctx.fillStyle = fill; ctx.fillText(txt, x, y); ctx.shadowBlur = 0;
}
function hookCard(t) {   // 0-3 sn, ilk kareden gorunur
  if (t >= 3.0) return; const out = ease((3.0 - t) / 0.3), sc = SHORT ? 1 : 0.8;
  ctx.save(); ctx.globalAlpha = out; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const cy = SHORT ? 720 : 430, g = ctx.createLinearGradient(0, cy - 300 * sc, 0, cy + 360 * sc);
  g.addColorStop(0, 'rgba(6,6,12,0)'); g.addColorStop(0.4, 'rgba(6,6,12,0.55)'); g.addColorStop(0.7, 'rgba(6,6,12,0.55)'); g.addColorStop(1, 'rgba(6,6,12,0)'); ctx.fillStyle = g; ctx.fillRect(0, cy - 300 * sc, W, 660 * sc);
  const k = ease(t / 0.5);
  stroked('“BEN” DEDİĞİN', W / 2, cy - 60 * sc, `${Math.round(130 * sc)}px Anton`, CREAM, 14 * sc);
  ctx.save(); ctx.translate(W / 2, cy + 215 * sc); ctx.scale(lerp(1.05, 1, k), lerp(1.05, 1, k));
  stroked('KİM?', 0, 0, `${Math.round(230 * sc)}px Anton`, AMBER, 20 * sc, 'rgba(242,176,74,0.55)'); ctx.restore();
  ctx.restore();
}
// kucuk etiket (alt ucte): gorunurken altyazi gizlenir
const LABELS = [
  ['Roger', 'ROGER SPERRY · MICHAEL GAZZANIGA', '1960’LAR · AYRIK BEYİN DENEYLERİ'],
  ['korpus', 'KORPUS KALLOZUM', 'İKİ YARIMKÜREYİ BAĞLAYAN KÖPRÜ'],
  [237, 'SOL BEYİN YORUMLAYICISI', 'GAZZANIGA'],
  [322, 'OTOBİYOGRAFİK BENLİK', 'SOSYAL EGO · KARAKTER BENLİK'],
  ['neokortekste', 'NEOKORTEKS', 'BEYNİN DIŞ KABUĞU'],
  [440, 'VAROLUŞSAL BENLİK', 'DAMASIO: ÇEKİRDEK BENLİK'],

function labelOn(T) { return LABELS.find(l => T >= l.t0 && T < l.t0 + l.d); }

window.READY = (async () => { await Promise.all(['130px Anton', '800 40px "Alegreya Sans"', '500 40px "Alegreya Sans"'].map(f => document.fonts.load(f, 'ŞİĞÜÖÇışğüöçâÂ“”’'))); await prep(); renderFrame(0); return { frames: FRAMES, fps: FPS, width: W, height: H, renderer: 'canvas' }; })();
