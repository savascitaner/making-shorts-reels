<html lang="tr"><head><meta charset="utf-8"><title>Bohr Einstein 9x16</title>
<style>

</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="words.js"></script>
<script>
const W = 1080, H = 1920, FPS = 30, DUR = window.DATA.duration, FRAMES = Math.round(DUR * FPS);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const D = window.DATA, WD = D.words;
const GOLD = '#F2B544', CREAM = '#F6EEDC', CYAN = '#7FE3FF', MAG = '#FF6FD8', CHALK = 'rgba(238,236,226,0.92)';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const wt = i => WD[i].s, we = i => WD[i].e;
const BOOM = (D.boom || [])[0] ?? -99;

// ---------------- clips (Veo frames) + stills ----------------
const CL = {
  v1: ['v1', 'flow/k1.jpg'], v2: ['v2', 'flow/k2.jpg'], v3: ['v3', 'flow/k3.jpg'], v4: ['v4', 'flow/k4.jpg'], v5: ['v5', 'flow/k5.jpg'],
  k1: ['x', 'flow/k1.jpg'], k2: ['x', 'flow/k2.jpg'], k3: ['x', 'flow/k3.jpg'], k4: ['x', 'flow/k4.jpg'], k5: ['x', 'flow/k5.jpg'], gece: ['x', 'flow/k6.jpg'], yuruyus: ['x', 'flow/k7.jpg'],
  solvay: ['x', 'gercek/solvay1927.jpg'], ikili: ['x', 'gercek/bohr-einstein-1925.jpg'], e21: ['x', 'gercek/einstein-1921-ref.jpg'], b22: ['x', 'gercek/bohr-1922-ref.jpg'], e47: ['x', 'gercek/einstein-1947-ref.jpg'],
  kapi: ['x', 'ai/a01_kapi_s7.jpg'], para: ['x', 'ai/a02_para_s7.jpg'], para2: ['x', 'ai/a02_para_s7.jpg'], zar: ['x', 'ai/a05_saat_s7.jpg'], zar2: ['x', 'ai/a03_zar_s42.jpg'],
  kutu: ['x', 'ai/a04_kutu_s7.jpg'], kutu2: ['x', 'ai/a04_kutu_s42.jpg'], saat: ['x', 'ai/a05_saat_s7.jpg'], satranc: ['x', 'ai/a06_satranc_s7.jpg'], satranc2: ['x', 'ai/a06_satranc_s42.jpg'],
  dunya: ['x', 'ai/a07_dunya_s42.jpg'], dunya2: ['x', 'ai/a07_dunya_s42.jpg'], uzak: ['x', 'ai/a08_uzak_s7.jpg'], lab: ['x', 'ai/a09_lab_s42.jpg'], lab2: ['x', 'ai/a09_lab_s42.jpg'],
  otel: ['x', 'ai/a10_otel_s7.jpg'], salon: ['x', 'ai/a11_salon_s7.jpg'], tahta: ['x', 'ai/a12_tahta_s7.jpg'], tahta2: ['x', 'ai/a12_tahta_s42.jpg'], bulut: ['x', 'ai/a13_bulut_s7.jpg'],
  kara: ['x', null],
};
// speaking clips: Veo speech span (klip/<k>/off.txt) is locked to [first word, last word] of the line
const SYNC = { v1: [38, 48], v2: [81, 84], v3: [94, 98], v4: [182, 189], v5: [262, 271] };
const OFF = {};
const CLIP_FPS = 24, BASE = '../gorseller/';
const CLN = {}, CLMAX = {};
const NOCLIP = new Set([]);
const FLICK = new Set(['zar', 'zar2', 'otel', 'gece', 'k5', 'v5', 'tahta', 'tahta2', 'kutu', 'kutu2']);
const G = {}, CACHE = new Map(), HAS = {};
function loadImg(src) { return new Promise(ok => { if (!src) return ok(null); const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = src; }); }
async function getImg(src) { if (CACHE.has(src)) { const v = CACHE.get(src); CACHE.delete(src); CACHE.set(src, v); return v; }
  const im = await loadImg(src); CACHE.set(src, im); if (CACHE.size > 300) CACHE.delete(CACHE.keys().next().value); return im; }
async function prep() {
  for (const [k, [dir, still]] of Object.entries(CL)) { G[k] = still ? await loadImg(BASE + still) : null;
    if (dir === 'x') continue;
    const n = await fetch(BASE + 'klip/' + dir + '/done').then(r => r.ok ? fetch(BASE + 'klip/' + dir + '/n.txt').then(r2 => r2.ok ? r2.text() : '192') : null).catch(() => null);
    HAS[k] = !NOCLIP.has(k) && !!n; if (n) CLN[k] = parseInt(n) || 192;
    if (n && k in SYNC) OFF[k] = await fetch(BASE + 'klip/' + dir + '/off.txt').then(r => r.ok ? r.text() : '0.6 3.0').then(x => x.trim().split(/\s+/).map(parseFloat)).catch(() => [0.6, 3.0]); }
  G.grain = [0, 1, 2, 3].map(s => { const c = document.createElement('canvas'); c.width = 540; c.height = 960; const x = c.getContext('2d'); const d = x.createImageData(540, 960); const r = rng(77 + s);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });
}
function clipIdx(lt, d, n) { const r = clamp((n / CLIP_FPS) / Math.max(d, 0.01), 0.55, 1); let i = Math.floor(lt * CLIP_FPS * r); const P = 2 * (n - 1); i = ((i % P) + P) % P; return i < n ? i : P - i; }
function frameSrcK(k, s, t) { const [dir] = CL[k]; if (!HAS[k]) return null; const lt = Math.max(0, t - s.t0); const n = CLMAX[k] || CLN[k];
  if (k in SYNC) { const [w0, w1] = SYNC[k], a = WD[w0].s, b = WD[w1].e, [o0, o1] = OFF[k]; const r = (o1 - o0) / Math.max(0.3, b - a);
    const ct = t < a ? o0 - (a - t) : t > b ? o1 + (t - b) : o0 + (t - a) * r; const i = clamp(Math.round(ct * CLIP_FPS), 0, n - 1); return BASE + 'klip/' + dir + '/' + String(i).padStart(3, '0') + '.jpg'; }
  return BASE + 'klip/' + dir + '/' + String(clipIdx(lt, s.t1 - s.t0, n)).padStart(3, '0') + '.jpg'; }
function drawImg(im, u, v, z, rot = 0, filter = 'none', R = [0, 0, W, H]) {
  if (!im) return; const [rx, ry, rw, rh] = R; const iw = im.width, ih = im.height, s = Math.max(rw / iw, rh / ih) * z;
  ctx.save(); ctx.beginPath(); ctx.rect(rx, ry, rw, rh); ctx.clip(); ctx.filter = filter; ctx.translate(rx + rw / 2, ry + rh / 2); if (rot) ctx.rotate(rot);
  const dw = iw * s, dh = ih * s; const ox = clamp(u * dw - rw / 2, 0, dw - rw), oy = clamp(v * dh - rh / 2, 0, dh - rh);
  ctx.drawImage(im, -rw / 2 - ox, -rh / 2 - oy, dw, dh); ctx.restore(); ctx.filter = 'none';
}

// ---------------- motion layers ----------------
const MOTES = (() => { const r = rng(33), a = []; for (let i = 0; i < 120; i++) a.push({ x: r(), y: r(), s: r(), p: r() * 6.28 }); return a; })();
function motes(t, amt, col = '#FFD58A') {
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const m of MOTES) { const x = ((m.x + Math.sin(t * 0.2 + m.p) * 0.03 + t * 0.004 * (m.s - 0.5)) % 1 + 1) % 1 * W, y = ((m.y - t * 0.01 * (0.3 + m.s)) % 1 + 1) % 1 * H, r = 1.5 + m.s * 3.5;
    ctx.globalAlpha = amt * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 2 + m.p))); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
function godRays(t, amt, cx = 0.7, cy = 0.05) {
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.translate(cx * W, cy * H);
  for (let i = 0; i < 7; i++) { const a = 0.35 + i * 0.13 + Math.sin(t * 0.3 + i) * 0.03; const g = ctx.createLinearGradient(0, 0, Math.cos(a + 1.2) * 1800, Math.sin(a + 1.2) * 1800);
    g.addColorStop(0, `rgba(255,210,130,${0.16 * amt})`); g.addColorStop(1, 'rgba(255,210,130,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a + 1.2 - 0.04) * 2200, Math.sin(a + 1.2 - 0.04) * 2200); ctx.lineTo(Math.cos(a + 1.2 + 0.04) * 2200, Math.sin(a + 1.2 + 0.04) * 2200); ctx.fill(); }
  ctx.restore();
}
const SMOKE = (() => { const r = rng(5), a = []; for (let i = 0; i < 26; i++) a.push({ x: r(), p: r() * 6.28, s: r() }); return a; })();
function smoke(t, amt, cx = 0.62, cy = 0.55) {   // pipe smoke curling up
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const m of SMOKE) { const k = ((t * 0.12 * (0.6 + m.s) + m.x) % 1); const x = cx * W + Math.sin(t * 0.7 + m.p + k * 5) * 70 * k, y = cy * H - k * 700, r = 30 + k * 160;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(210,210,220,${0.10 * amt * (1 - k)})`); g.addColorStop(1, 'rgba(210,210,220,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
const CLOUD = (() => { const r = rng(11), a = []; for (let i = 0; i < 420; i++) { const ang = r() * 6.283, rad = Math.pow(r(), 0.6); a.push({ a: ang, r: rad, s: r(), p: r() * 6.28 }); } return a; })();
function probCloud(t, lt, amt, collapse = -1) {   // electron as a cloud of possibilities; collapses to one point when measured
  const cx = W / 2, cy = H * 0.42, R = 360; const c = collapse >= 0 ? ease(collapse / 0.5) : 0;
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const p of CLOUD) { const jit = Math.sin(t * 3 + p.p) * 0.08; const rr = (p.r + jit) * R * (1 - c * 0.97); const x = cx + Math.cos(p.a + t * 0.25 * (p.s - 0.5)) * rr, y = cy + Math.sin(p.a + t * 0.25 * (p.s - 0.5)) * rr * 0.85;
    ctx.globalAlpha = amt * (0.25 + 0.6 * (0.5 + 0.5 * Math.sin(t * 4 + p.p))); ctx.fillStyle = p.s > 0.75 ? GOLD : CYAN; ctx.beginPath(); ctx.arc(x, y, 2 + p.s * 3, 0, 6.283); ctx.fill(); }
  if (c > 0) { const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 90); g.addColorStop(0, `rgba(255,240,200,${c})`); g.addColorStop(1, 'rgba(255,200,120,0)'); ctx.fillStyle = g; ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(cx, cy, 90, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
function glowDot(x, y, col, r, a) { ctx.save(); ctx.globalCompositeOperation = 'screen'; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(0.25, col); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.globalAlpha = a; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.restore(); }
function entangle(t, lt, amt, mode) {   // two linked particles; measuring one fixes the other at once
  const ax = W * 0.5, ay = H * 0.66, bx = W * 0.5, by = H * 0.16; const meas = WD[243] ? t - wt(243) : -1;
  const pulse = 0.6 + 0.4 * Math.sin(t * 5); const fixed = meas > 0;
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.setLineDash([6, 14]); ctx.lineDashOffset = -t * 60; ctx.strokeStyle = `rgba(200,190,255,${0.45 * amt})`; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.bezierCurveTo(ax + 260, ay - 500, bx - 260, by + 500, bx, by); ctx.stroke(); ctx.restore();
  glowDot(ax, ay, 'rgba(127,227,255,0.8)', 110 * (fixed ? 1.2 : pulse), amt);
  glowDot(bx, by, 'rgba(255,111,216,0.8)', 90 * (fixed ? 1.2 : pulse), amt);
  if (fixed && meas < 0.6) { const k = 1 - meas / 0.6; ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.strokeStyle = `rgba(255,255,255,${k})`; ctx.lineWidth = 6;
    for (const [x, y] of [[ax, ay], [bx, by]]) { ctx.beginPath(); ctx.arc(x, y, 60 + (1 - k) * 260, 0, 6.283); ctx.stroke(); } ctx.restore(); }
}

// ---------------- chalk diagram: Einstein's light box (drawn on as the words arrive) ----------------
function chalkLine(pts, k, w = 6) { if (k <= 0) return; const L = []; let tot = 0; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(d); tot += d; }
  let rem = tot * clamp(k, 0, 1); ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && rem > 0; i++) { const f = Math.min(1, rem / L[i - 1]); ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)); rem -= L[i - 1]; }
  ctx.lineWidth = w; ctx.stroke(); }
function chalkLabel(s, x, y, a, col = CHALK, size = 40) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.font = `700 ${size}px Cinzel`; ctx.textAlign = 'center'; ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore(); }
function board(t, mode) {
  // background: dark slate board with chalk dust
  if (mode !== 3) { const g = ctx.createRadialGradient(W / 2, H * 0.45, 100, W / 2, H * 0.45, H * 0.8); g.addColorStop(0, '#1d2a26'); g.addColorStop(1, '#0a100e'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = 0.10; ctx.globalCompositeOperation = 'screen'; ctx.drawImage(G.grain[0], 0, 0, W, H); ctx.restore(); }
  const K = (i, d = 0.9) => WD[i] ? ease((t - wt(i) + 0.05) / d) : 0;
  const lift = mode === 2 ? ease((t - wt(187)) / 1.2) * 70 : 0;           // Bohr: the box moves up when the photon leaves
  const cx = W / 2, top = 250, springEnd = 640 - lift, bx0 = cx - 210, bw = 420, by0 = springEnd + 40, bh = 380;
  ctx.save(); ctx.strokeStyle = CHALK; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowColor = 'rgba(255,255,255,0.35)'; ctx.shadowBlur = 6;
  const kBox = mode === 1 ? K(130) : 1, kSpr = mode === 1 ? K(134) : 1, kShut = mode === 1 ? K(137) : 1, kPh = mode === 1 ? clamp((t - wt(142)) / 1.6, 0, 1) : 1, kClk = mode === 1 ? K(150) : 1;
  // ceiling bracket + spring
  chalkLine([[cx - 150, top], [cx + 150, top]], kSpr, 8);
  const sp = [[cx, top]]; const n = 14; for (let i = 1; i <= n; i++) sp.push([cx + (i % 2 ? 46 : -46) * (i < n ? 1 : 0), top + (springEnd - top) * i / n]); chalkLine(sp, kSpr, 5);
  // scale with pointer
  chalkLine([[cx + 230, top + 40], [cx + 230, top + 520]], kSpr, 4);
  for (let i = 0; i <= 8; i++) chalkLine([[cx + 230, top + 60 + i * 55], [cx + 260, top + 60 + i * 55]], kSpr, 3);
  chalkLine([[cx + 40, springEnd], [cx + 222, springEnd - 2]], kSpr, 4);
  // box
  chalkLine([[bx0, by0], [bx0 + bw, by0], [bx0 + bw, by0 + bh], [bx0, by0 + bh], [bx0, by0]], kBox, 7);
  chalkLine([[cx, springEnd], [cx, by0]], kBox, 5);
  // weight below
  chalkLine([[cx, by0 + bh], [cx, by0 + bh + 90]], kBox, 4); chalkLine([[cx - 50, by0 + bh + 90], [cx + 50, by0 + bh + 90], [cx + 40, by0 + bh + 160], [cx - 40, by0 + bh + 160], [cx - 50, by0 + bh + 90]], kBox, 5);
  // clock inside the box
  const ccx = cx - 70, ccy = by0 + 170, cr = 95; if (kClk > 0) { ctx.beginPath(); ctx.arc(ccx, ccy, cr, -Math.PI / 2, -Math.PI / 2 + 6.283 * kClk); ctx.lineWidth = 5; ctx.stroke(); }
  if (kClk > 0.9) { let ang = (t - wt(150)) * 1.2; if (mode === 2) { const w = ease((t - wt(200)) / 1.0); ang = t * 1.2 + Math.sin(t * 7) * 0.35 * w; }
    ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(ccx, ccy); ctx.lineTo(ccx + Math.cos(ang - 1.57) * cr * 0.8, ccy + Math.sin(ang - 1.57) * cr * 0.8); ctx.stroke();
    ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(ccx, ccy); ctx.lineTo(ccx + Math.cos(ang / 12 - 0.6) * cr * 0.5, ccy + Math.sin(ang / 12 - 0.6) * cr * 0.5); ctx.stroke(); }
  // shutter on the right wall
  const sy = by0 + 150, open = mode === 1 ? ease((t - wt(138)) / 0.5) : 1; chalkLine([[bx0 + bw, sy], [bx0 + bw + 70 * open, sy - 70 * open]], kShut, 6);
  ctx.restore();
  // light inside, photon leaving
  ctx.save(); ctx.globalCompositeOperation = 'screen'; const glow = ctx.createRadialGradient(cx + 80, by0 + 200, 10, cx + 80, by0 + 200, 180); glow.addColorStop(0, `rgba(255,214,120,${0.5 * kBox})`); glow.addColorStop(1, 'rgba(255,214,120,0)'); ctx.fillStyle = glow; ctx.fillRect(bx0, by0, bw, bh); ctx.restore();
  if (mode !== 3 && kPh > 0 && (mode === 1 || t - wt(182) < 3)) { const k2 = mode === 1 ? kPh : ease((t - wt(182)) / 1.6); const px = bx0 + bw + 20 + k2 * 420, py = sy - 10 - k2 * 60; glowDot(px, py, 'rgba(255,200,90,0.9)', 70, 1);
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.strokeStyle = 'rgba(255,214,140,0.6)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(bx0 + bw, sy - 5); ctx.lineTo(px, py); ctx.stroke(); ctx.restore(); }
  // labels
  if (mode === 1) { chalkLabel('TARTI', cx + 245, top + 590, K(134)); chalkLabel('SAAT', ccx, by0 + bh - 40, K(150)); chalkLabel('FOTON', bx0 + bw + 220, sy - 110, K(142));
    chalkLabel('E = mc²', cx, by0 + bh + 280, K(145), GOLD, 64); }
  if (mode === 1 && t > wt(158) - 0.1) { const k = ease((t - wt(158)) / 0.4); ctx.save(); ctx.globalAlpha = k; ctx.textAlign = 'center'; ctx.font = '110px Anton'; ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(6,6,16,0.9)'; ctx.strokeText('Δt · ΔE = 0 ?', cx, 1640); ctx.fillStyle = GOLD; ctx.fillText('Δt · ΔE = 0 ?', cx, 1640); ctx.restore(); }
  if (mode === 2) { // gravity: warped time lines around the clock, uncertainty returns
    const w = ease((t - wt(195)) / 1.2); if (w > 0) { ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.strokeStyle = `rgba(242,181,68,${0.55 * w})`; ctx.lineWidth = 3;
      for (let i = -4; i <= 4; i++) { ctx.beginPath(); for (let y = 200; y <= 1500; y += 20) { const d = (y - ccy) / 260; const x = cx + i * 120 + Math.sign(i || 1) * -60 * Math.exp(-d * d) * w + Math.sin(t * 2 + y * 0.01) * 4; y === 200 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke(); }
      ctx.restore(); }
    chalkLabel('↑', bx0 - 70, by0 + 120, ease((t - wt(187)) / 0.5), GOLD, 120);
    if (t > wt(204) - 0.1) { const k = ease((t - wt(204)) / 0.4); ctx.save(); ctx.globalAlpha = k; ctx.textAlign = 'center'; ctx.font = '110px Anton'; ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(6,6,16,0.9)'; ctx.strokeText('Δt · ΔE ≥ ħ/2', cx, 1640); ctx.fillStyle = GOLD; ctx.fillText('Δt · ΔE ≥ ħ/2', cx, 1640); ctx.restore(); }
  }
}

// ---------------- text cards ----------------
function cardText(lines, lt, { y = 820, size = 120, color = CREAM, sub = null, subColor = GOLD, font = 'Anton', fade = 0.35, band = 0.45 } = {}) {
  const a = fade ? ease(lt / fade) : 1; if (a <= 0) return;
  if (band) { const g = ctx.createLinearGradient(0, y - size * 1.9, 0, y + size * (lines.length + 0.6)); g.addColorStop(0, 'rgba(5,6,18,0)'); g.addColorStop(0.3, `rgba(5,6,18,${band * a})`); g.addColorStop(0.7, `rgba(5,6,18,${band * a})`); g.addColorStop(1, 'rgba(5,6,18,0)'); ctx.fillStyle = g; ctx.fillRect(0, y - size * 1.9, W, size * (lines.length + 2.5)); }
