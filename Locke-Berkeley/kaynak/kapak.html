<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Cinzel;font-weight:700;src:url(fonts/cinzel-latin-700.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:Cinzel;font-weight:700;src:url(fonts/cinzel-latin-ext-700.woff2) format('woff2');unicode-range:U+0100-024F}
html,body{margin:0;background:#000}</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script>
const W=1080,H=1920,cv=document.getElementById('c'),ctx=cv.getContext('2d'),GOLD='#F2B544',CREAM='#F6EEDC';
const L=s=>new Promise(o=>{const i=new Image();i.onload=()=>o(i);i.src=s});
function img(im,u,v,z,R){const[rx,ry,rw,rh]=R,s=Math.max(rw/im.width,rh/im.height)*z,dw=im.width*s,dh=im.height*s;ctx.save();ctx.beginPath();ctx.rect(rx,ry,rw,rh);ctx.clip();
 ctx.drawImage(im,rx-Math.min(Math.max(u*dw-rw/2,0),dw-rw),ry-Math.min(Math.max(v*dh-rh/2,0),dh-rh),dw,dh);ctx.restore();}
function txt(s,y,size,col,font='Anton'){ctx.font=(font==='Anton'?'':'700 ')+size+'px '+font;let m=ctx.measureText(s).width;if(m>1000){size=Math.floor(size*1000/m);ctx.font=(font==='Anton'?'':'700 ')+size+'px '+font;}
 ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=size*0.12;ctx.strokeStyle='rgba(6,6,16,0.95)';ctx.strokeText(s,W/2,y);ctx.fillStyle=col;ctx.shadowColor='rgba(242,181,68,0.55)';ctx.shadowBlur=40;ctx.fillText(s,W/2,y);ctx.shadowBlur=0;}
window.captureFrame=async()=>cv.toDataURL('image/png');
window.READY=(async()=>{await Promise.all(['100px Anton','700 40px Cinzel'].map(f=>document.fonts.load(f,'ŞİĞÜÖÇışğüöç')));
 const a=await L('../gorseller/flow/rl.jpg'),b=await L('../gorseller/flow/b04.jpg');
 img(a,0.5,0.3,1.0,[0,0,W,H/2]);img(b,0.5,0.3,1.0,[0,H/2,W,H/2]);
 let g=ctx.createLinearGradient(0,H*0.3,0,H*0.7);g.addColorStop(0,'rgba(5,6,15,0)');g.addColorStop(0.5,'rgba(5,6,15,0.75)');g.addColorStop(1,'rgba(5,6,15,0)');ctx.fillStyle=g;ctx.fillRect(0,H*0.3,W,H*0.4);
 ctx.fillStyle=GOLD;ctx.shadowColor='rgba(255,180,80,0.9)';ctx.shadowBlur=30;ctx.fillRect(0,H/2-3,W,6);ctx.shadowBlur=0;
 txt('SEN BAKMAYINCA',H/2-60,150,CREAM);txt('BU ELMA VAR MI?',H/2+170,170,GOLD);
 ctx.font='700 46px Cinzel';ctx.textAlign='center';ctx.fillStyle=GOLD;ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=14;
 ctx.font='700 60px Cinzel';ctx.fillText('JOHN LOCKE',W/2,130);ctx.fillText('GEORGE BERKELEY',W/2,H-90);ctx.shadowBlur=0;
 return{frames:1,fps:30,width:W,height:H,renderer:'canvas'};})();
</script></body></html>
