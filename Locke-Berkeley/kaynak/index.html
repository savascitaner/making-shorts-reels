<html lang="tr"><head><meta charset="utf-8"><title>Locke Berkeley 9x16</title>
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}

</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="words.js"></script>
<script>
const W = 1080, H = 1920, FPS = 30, DUR = window.DATA.duration, FRAMES = Math.round(DUR * FPS);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const D = window.DATA, WD = D.words;
const GOLD = '#F2B544', CREAM = '#F6EEDC', EMBER = '#FF9B54', INDIGO = '#0B1026';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const wt = i => WD[i].s;
const BOOM = (D.boom || [])[0] ?? -99;   // hook impact time (video.json "boom")

// ---------------- clips (Veo/LTX frames) + stills ----------------
// key: [klip folder name, still]
const CL = {
  v1: ['v1', 'flow/l01.jpg'], v2: ['v2', 'flow/b01.jpg'], v3: ['v3', 'flow/l02.jpg'], v4: ['v4', 'flow/b02.jpg'], v5: ['v5', 'flow/l04.jpg'], v6: ['v6', 'flow/b03.jpg'],
  ldinle: ['x', 'flow/l03.jpg'], bdinle: ['x', 'flow/b04.jpg'], lelma: ['x', 'flow/l01.jpg'], ikili: ['x', 'flow/i01.jpg'], ikili2: ['x', 'flow/i02.jpg'], rl: ['x', 'flow/rl.jpg'], rb: ['x', 'flow/rb.jpg'],
  elma: ['x', 'ai/b01_elma_s7.jpg'], elma2: ['x', 'ai/b01_elma_s42.jpg'], kutup: ['x', 'ai/b02_kutuphane_s7.jpg'], kutup2: ['x', 'ai/b02_kutuphane_s42.jpg'], mum: ['x', 'ai/b03_mum_s7.jpg'],
  masa: ['x', 'ai/b04_masa_s7.jpg'], kitap: ['x', 'ai/b05_kitap_s7.jpg'], ortu: ['x', 'ai/b06_ortu_s7.jpg'], isik: ['x', 'ai/b07_isik_s42.jpg'], isik2: ['x', 'ai/b07_isik_s7.jpg'],
  oda: ['x', 'ai/b08_oda_s42.jpg'], oda2: ['x', 'ai/b08_oda_s7.jpg'], kapi: ['x', 'ai/b09_kapi_s7.jpg'], pencere: ['x', 'ai/b10_pencere_s7.jpg'], yarim: ['x', 'ai/b11_elma_yarim_s7.jpg'],
  goz: ['x', 'ai/b12_goz_s7.jpg'], raf: ['x', 'ai/b13_raf_s7.jpg'], gok: ['x', 'ai/b14_gokyuzu_s42.jpg'], sandalye: ['x', 'ai/b15_sandalye_s7.jpg'], agac: ['x', 'ai/b16_agac_s42.jpg'], agac2: ['x', 'ai/b16_agac_s7.jpg'], orman: ['x', 'ai/b17_orman_s7.jpg'],
  g01: ['x', 'gercek/g01-locke-kneller.jpg'], g02: ['x', 'gercek/g02-berkeley-smibert.jpg'],
};
// speaking clips: Veo speech onset (klip/<k>/off.txt, seconds) is locked to the first word of the line
const SYNC = { v1: [16, 28], v2: [29, 41], v3: [52, 66], v4: [129, 134], v5: [144, 160], v6: [161, 163] };   // [first word, last word] of the spoken line
const OFF = {};
const CLIP_FPS = 24, BASE = '../gorseller/';
const CLN = {};            // frames per clip, read from klip/<k>/n.txt
const CLMAX = {};
const NOCLIP = new Set([]);
const FLICK = new Set(['mum', 'masa', 'kutup', 'kutup2', 'v1', 'v2', 'v5', 'ikili', 'ldinle', 'bdinle', 'elma', 'elma2', 'lelma', 'sandalye']);
const G = {}, CACHE = new Map(), HAS = {};
function loadImg(src) { return new Promise(ok => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = src; }); }
async function getImg(src) { if (CACHE.has(src)) { const v = CACHE.get(src); CACHE.delete(src); CACHE.set(src, v); return v; }
  const im = await loadImg(src); CACHE.set(src, im); if (CACHE.size > 300) CACHE.delete(CACHE.keys().next().value); return im; }
async function prep() {
  for (const [k, [dir, still]] of Object.entries(CL)) { G[k] = await loadImg(BASE + still);
    const n = await fetch(BASE + 'klip/' + dir + '/done').then(r => r.ok ? fetch(BASE + 'klip/' + dir + '/n.txt').then(r2 => r2.ok ? r2.text() : '97') : null).catch(() => null);
    HAS[k] = !NOCLIP.has(k) && !!n; if (n) CLN[k] = parseInt(n) || 97;
    if (n && k in SYNC) OFF[k] = await fetch(BASE + 'klip/' + dir + '/off.txt').then(r => r.ok ? r.text() : '0.6 3.0').then(x => x.trim().split(/\s+/).map(parseFloat)).catch(() => [0.6, 3.0]); }
  G.grain = [0, 1, 2, 3].map(s => { const c = document.createElement('canvas'); c.width = 540; c.height = 960; const x = c.getContext('2d'); const d = x.createImageData(540, 960); const r = rng(77 + s);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });
}
function clipIdx(lt, d, n) {   // fill the shot: slow the clip down (to 0.55x), then ping-pong
  const r = clamp((n / CLIP_FPS) / Math.max(d, 0.01), 0.55, 1); let i = Math.floor(lt * CLIP_FPS * r); const P = 2 * (n - 1); i = ((i % P) + P) % P; return i < n ? i : P - i;
}
function frameSrcK(k, s, t, off = 0) { const [dir] = CL[k]; if (!HAS[k]) return null; const lt = Math.max(0, t - s.t0) + off; const n = CLMAX[k] || CLN[k];
  if (k in SYNC) { const [w0, w1] = SYNC[k], a = WD[w0].s, b = WD[w1].e, [o0, o1] = OFF[k]; const r = (o1 - o0) / Math.max(0.3, b - a);
    const ct = t < a ? o0 - (a - t) : t > b ? o1 + (t - b) : o0 + (t - a) * r; const i = clamp(Math.round(ct * CLIP_FPS), 0, n - 1); return BASE + 'klip/' + dir + '/' + String(i).padStart(3, '0') + '.jpg'; }
  return BASE + 'klip/' + dir + '/' + String(clipIdx(lt, s.t1 - s.t0, n)).padStart(3, '0') + '.jpg'; }
function drawImg(im, u, v, z, rot = 0, filter = 'none', R = [0, 0, W, H]) {
  if (!im) return; const [rx, ry, rw, rh] = R; const iw = im.width, ih = im.height, s = Math.max(rw / iw, rh / ih) * z;
  ctx.save(); ctx.beginPath(); ctx.rect(rx, ry, rw, rh); ctx.clip(); ctx.filter = filter; ctx.translate(rx + rw / 2, ry + rh / 2); if (rot) ctx.rotate(rot);
  const dw = iw * s, dh = ih * s; const ox = clamp(u * dw - rw / 2, 0, dw - rw), oy = clamp(v * dh - rh / 2, 0, dh - rh);
  ctx.drawImage(im, -rw / 2 - ox, -rh / 2 - oy, dw, dh); ctx.restore(); ctx.filter = 'none';
}

// ---------------- motion layers ----------------
const DROPS = (() => { const r = rng(9), a = []; for (let i = 0; i < 160; i++) a.push({ x: r(), y: r(), s: r() }); return a; })();
function rain(t, amt) {
  ctx.save(); ctx.strokeStyle = 'rgba(200,215,255,0.35)'; ctx.lineWidth = 2;
  for (const d of DROPS) { const sp = 900 + d.s * 900, y = ((d.y * H + t * sp) % (H + 200)) - 100, x = d.x * W - (y / H) * 60, l = 30 + d.s * 60;
    ctx.globalAlpha = amt * (0.3 + d.s * 0.6); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 8, y + l); ctx.stroke(); }
  ctx.restore();
}
const MOTES = (() => { const r = rng(33), a = []; for (let i = 0; i < 120; i++) a.push({ x: r(), y: r(), s: r(), p: r() * 6.28 }); return a; })();
function motes(t, amt) {
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const m of MOTES) { const x = ((m.x + Math.sin(t * 0.2 + m.p) * 0.03 + t * 0.004 * (m.s - 0.5)) % 1 + 1) % 1 * W, y = ((m.y - t * 0.01 * (0.3 + m.s)) % 1 + 1) % 1 * H, r = 1.5 + m.s * 3.5;
    ctx.globalAlpha = amt * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 2 + m.p))); ctx.fillStyle = '#FFD58A'; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
function godRays(t, amt, cx = 0.7, cy = 0.05) {
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.translate(cx * W, cy * H);
  for (let i = 0; i < 7; i++) { const a = 0.35 + i * 0.13 + Math.sin(t * 0.3 + i) * 0.03; ctx.rotate(0); const g = ctx.createLinearGradient(0, 0, Math.cos(a + 1.2) * 1800, Math.sin(a + 1.2) * 1800);
    g.addColorStop(0, `rgba(255,210,130,${0.16 * amt})`); g.addColorStop(1, 'rgba(255,210,130,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a + 1.2 - 0.04) * 2200, Math.sin(a + 1.2 - 0.04) * 2200); ctx.lineTo(Math.cos(a + 1.2 + 0.04) * 2200, Math.sin(a + 1.2 + 0.04) * 2200); ctx.fill(); }
  ctx.restore();
}


function goldPoint(x, y, lt, amt = 1, rings = true) {   // the "centre": a golden point with rings spreading out
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  const g = ctx.createRadialGradient(x, y, 0, x, y, 120); g.addColorStop(0, `rgba(255,236,190,${amt})`); g.addColorStop(0.25, `rgba(242,181,68,${0.6 * amt})`); g.addColorStop(1, 'rgba(242,181,68,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 120, 0, 6.283); ctx.fill();
  if (rings) for (let i = 0; i < 5; i++) { const k = ((lt * 0.45 + i / 5) % 1); ctx.strokeStyle = `rgba(255,214,140,${0.7 * amt * (1 - k)})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, 40 + k * 620, 0, 6.283); ctx.stroke(); }
  ctx.restore();
}
function splitLine(lt, amt = 1) {   // the seam between the two worlds
  const k = ease(lt / 0.35); ctx.save(); ctx.globalCompositeOperation = 'screen';
  const g = ctx.createLinearGradient(W / 2 - W * k / 2, 0, W / 2 + W * k / 2, 0); g.addColorStop(0, 'rgba(242,181,68,0)'); g.addColorStop(0.5, `rgba(255,226,170,${amt})`); g.addColorStop(1, 'rgba(242,181,68,0)');
  ctx.fillStyle = g; ctx.fillRect(0, H / 2 - 3, W, 6); ctx.shadowColor = 'rgba(255,180,80,0.9)'; ctx.shadowBlur = 30; ctx.fillRect(W / 2 - W * k / 2, H / 2 - 1.5, W * k, 3); ctx.restore();
}
function joinBeam(lt, amt = 1) {   // gold light running vertically through both halves (the shared idea)
  const k = ease((lt - 0.2) / 1.4); if (k <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'screen';
  const g = ctx.createLinearGradient(0, H / 2 - H * k / 2, 0, H / 2 + H * k / 2); g.addColorStop(0, 'rgba(242,181,68,0)'); g.addColorStop(0.5, `rgba(255,226,170,${0.85 * amt})`); g.addColorStop(1, 'rgba(242,181,68,0)');
  ctx.fillStyle = g; ctx.shadowColor = 'rgba(255,180,80,0.9)'; ctx.shadowBlur = 40; ctx.fillRect(W / 2 - 3, H / 2 - H * k / 2, 6, H * k); ctx.restore();
  goldPoint(W / 2, H / 2, lt, 0.8 * k, false);
}
function spheres(t, lt) {   // possible worlds; one is chosen
  const r = rng(21); ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 40; i++) { const x = r() * W, y = r() * H, R = 14 + r() * 40, p = r() * 6.28; const a = 0.25 + 0.2 * Math.sin(t * 1.3 + p);
    ctx.strokeStyle = `rgba(190,210,255,${a})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x + Math.sin(t * 0.3 + p) * 12, y + Math.cos(t * 0.25 + p) * 12, R, 0, 6.283); ctx.stroke(); }
  ctx.restore(); const k = ease((lt - 1.2) / 1.2); if (k > 0) goldPoint(W / 2, H * 0.42, lt, k, true);
}
const BITS = (() => { const r = rng(4), a = []; for (let i = 0; i < 70; i++) a.push({ x: r(), y: r(), s: r(), b: r() > 0.5 ? '1' : '0' }); return a; })();
function binary(t, lt, amt) {
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.textAlign = 'center'; ctx.font = '700 64px Cinzel';
  for (const d of BITS) { const y = ((d.y * H + t * (120 + d.s * 220)) % (H + 100)) - 50; ctx.globalAlpha = amt * ease(lt / 0.8) * (0.25 + 0.6 * d.s); ctx.fillStyle = d.s > 0.7 ? GOLD : '#9fd0ff'; ctx.fillText(d.b, d.x * W, y); }
  ctx.restore();
}
function flashWords(t) {   // SAVAŞ? HASTALIK? ÖLÜM? over the hush
  [['SAVAŞ?', 4.25], ['HASTALIK?', 4.55], ['ÖLÜM?', 4.85]].forEach(([s, a], i) => { const lt = t - a; if (lt < 0 || t > BOOM) return;
    const k = ease(lt / 0.08); ctx.save(); ctx.globalAlpha = k * (i === 2 || t < [4.55, 4.85][i] ? 1 : 0.35); ctx.textAlign = 'center'; ctx.font = '170px Anton'; ctx.lineWidth = 16; ctx.strokeStyle = 'rgba(6,6,16,0.92)';
    const y = 640 + i * 230; ctx.strokeText(s, W / 2, y); ctx.fillStyle = i === 2 ? GOLD : CREAM; ctx.fillText(s, W / 2, y); ctx.restore(); });
}

function wire(t, lt) {   // the apple's shape alone: a golden wireframe sphere made of light
  const k = ease(lt / 1.2), cx = W / 2, cy = H * 0.47, R = 330; ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.strokeStyle = `rgba(255,214,140,${0.85 * k})`; ctx.lineWidth = 3; ctx.shadowColor = 'rgba(255,180,80,0.9)'; ctx.shadowBlur = 18;
  for (let i = 0; i < 9; i++) { const a = (i / 9) * Math.PI + t * 0.4; ctx.beginPath(); ctx.ellipse(cx, cy, Math.abs(Math.cos(a)) * R, R, 0, 0, 6.283); ctx.stroke(); }
  for (let j = 1; j < 6; j++) { const y = cy - R + (j / 6) * 2 * R, rr = Math.sqrt(Math.max(0, R * R - (y - cy) ** 2)); ctx.beginPath(); ctx.ellipse(cx, y, rr, rr * 0.18, 0, 0, 6.283); ctx.stroke(); }
  ctx.restore(); motes(t, 0.6 * k);
}
// ---------------- text cards ----------------
function cardText(lines, lt, { y = 820, size = 120, color = CREAM, sub = null, subColor = GOLD, font = 'Anton', fade = 0.35, band = 0.45, w = 400 } = {}) {
  const a = fade ? ease(lt / fade) : 1;
  if (band) { const g = ctx.createLinearGradient(0, y - size * 1.9, 0, y + size * (lines.length + 0.6)); g.addColorStop(0, 'rgba(5,6,18,0)'); g.addColorStop(0.3, `rgba(5,6,18,${band * a})`); g.addColorStop(0.7, `rgba(5,6,18,${band * a})`); g.addColorStop(1, 'rgba(5,6,18,0)'); ctx.fillStyle = g; ctx.fillRect(0, y - size * 1.9, W, size * (lines.length + 2.5)); }
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  lines.forEach((s, i) => { let sz = size; ctx.font = `${font === 'Anton' ? '' : '900 '}${sz}px ${font}`; const mw = ctx.measureText(s).width; if (mw > 980) { sz = Math.floor(sz * 980 / mw); ctx.font = `${font === 'Anton' ? '' : '900 '}${sz}px ${font}`; }
    const yy = y + i * size * 1.08 + (fade ? (1 - a) * 20 : 0); ctx.lineWidth = sz * 0.09; ctx.strokeStyle = 'rgba(6,6,16,0.9)'; ctx.strokeText(s, W / 2, yy);
    ctx.fillStyle = Array.isArray(color) ? color[i] : color; ctx.shadowColor = 'rgba(242,181,68,0.5)'; ctx.shadowBlur = 34; ctx.fillText(s, W / 2, yy); ctx.shadowBlur = 0; });
  if (sub) { ctx.font = '700 42px Cinzel'; ctx.fillStyle = subColor; ctx.fillText(sub, W / 2, y - size * 1.0); ctx.fillRect(W / 2 - 70, y - size * 1.0 + 22, 140, 3); }
  ctx.restore();
}

// ---------------- shot list ----------------
// [startWord, clip ('A|B' = split screen: A top Istanbul, B bottom Hannover), from[u,v,z], to[u,v,z], fx, card]
const SH = [
  [0, 'oda', [0.5, 0.5, 1.0], [0.5, 0.5, 1.12], 'dark'],
  [6, 'kapi', [0.5, 0.5, 1.15], [0.5, 0.5, 1.02], 'boom'],
  [10, 'elma', [0.5, 0.5, 1.0], [0.5, 0.5, 1.15], 'none', 'elmavar'],
  [16, 'v1', [0.5, 0.45, 1.0], [0.5, 0.45, 1.04], 'none', 'locke'],
  [29, 'v2', [0.5, 0.45, 1.0], [0.5, 0.45, 1.04], 'none', 'berkeley'],
  [42, 'yarim', [0.5, 0.5, 1.0], [0.5, 0.5, 1.12], 'motes'],
  [49, 'goz', [0.5, 0.5, 1.12], [0.5, 0.5, 1.0], 'none', 'ikincil'],
  [52, 'v3', [0.5, 0.45, 1.0], [0.5, 0.45, 1.05], 'none', 'birincil'],
  [67, 'bdinle', [0.5, 0.45, 1.0], [0.5, 0.45, 1.08], 'hit'],
  [68, 'elma2', [0.5, 0.5, 1.0], [0.5, 0.5, 1.15], 'solma'],
  [80, 'ldinle', [0.5, 0.45, 1.05], [0.5, 0.45, 1.12], 'hit'],
  [81, 'elma', [0.5, 0.5, 1.1], [0.5, 0.5, 1.0], 'tel', 'zihinde'],
  [92, 'kutup', [0.5, 0.5, 1.0], [0.5, 0.45, 1.12], 'motes'],
  [99, 'kitap', [0.5, 0.5, 1.0], [0.5, 0.5, 1.12], 'none'],
  [102, 'raf', [0.5, 0.5, 1.12], [0.5, 0.5, 1.0], 'none', 'toz'],
  [106, 'masa', [0.5, 0.5, 1.0], [0.55, 0.5, 1.1], 'motes'],
  [112, 'ldinle', [0.5, 0.42, 1.0], [0.5, 0.42, 1.08], 'none'],
  [121, 'pencere', [0.5, 0.5, 1.0], [0.5, 0.5, 1.12], 'none'],
  [126, 'kutup2', [0.5, 0.5, 1.12], [0.5, 0.5, 1.0], 'motes'],
  [129, 'v4', [0.5, 0.45, 1.0], [0.5, 0.45, 1.05], 'none', 'esse'],
  [135, 'agac', [0.5, 0.5, 1.0], [0.5, 0.5, 1.15], 'dark'],
  [139, 'orman', [0.5, 0.5, 1.12], [0.5, 0.5, 1.0], 'dark'],
  [141, 'agac2', [0.5, 0.5, 1.15], [0.5, 0.5, 1.02], 'hit', 'agac'],
  [144, 'v5', [0.5, 0.45, 1.0], [0.5, 0.42, 1.06], 'none'],
  [161, 'v6', [0.5, 0.45, 1.0], [0.5, 0.45, 1.04], 'none'],
  [164, 'ikili2', [0.5, 0.5, 1.0], [0.5, 0.5, 1.1], 'rays'],
  [171, 'ortu', [0.5, 0.5, 1.0], [0.5, 0.5, 1.15], 'motes'],
  [176, 'isik', [0.5, 0.5, 1.0], [0.5, 0.45, 1.12], 'rays', 'sonsuz'],
  [184, 'gok', [0.5, 0.6, 1.0], [0.5, 0.4, 1.15], 'rays'],
  [193, 'rl|rb', [0.5, 0.3, 1.0], [0.5, 0.28, 1.1], 'split', 'taraf'],
  [209, 'oda2', [0.5, 0.5, 1.0], [0.5, 0.5, 1.12], 'dark', 'odadan'],
  [219, 'ikili', [0.5, 0.5, 1.0], [0.5, 0.5, 1.08], 'none', 'yorum'],
  [-2, 'sandalye', [0.5, 0.5, 1.0], [0.5, 0.5, 1.05], 'end', 'end'],
];
const LBL = ['LOCKE', 'BERKELEY'];
const END_T = 119.7;
const SHOTS = SH.map((s, i) => ({ t0: i === 0 ? 0 : s[0] === -2 ? END_T : wt(s[0]) - 0.12, k: s[1], a: s[2], b: s[3], fx: s[4], card: s[5] }));
SHOTS.forEach((s, i) => s.t1 = i + 1 < SHOTS.length ? SHOTS[i + 1].t0 : DUR + 0.5);
