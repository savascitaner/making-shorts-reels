<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Spinoza 9x16</title>
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Cinzel;font-weight:900;src:url(fonts/cinzel-latin-900.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cinzel;font-weight:900;src:url(fonts/cinzel-latin-ext-900.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF}
@font-face{font-family:Cinzel;font-weight:700;src:url(fonts/cinzel-latin-700.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}

</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="words.js"></script>
<script>
const W = 1080, H = 1920, FPS = 30, DUR = window.DATA.duration, FRAMES = Math.round(DUR * FPS);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const D = window.DATA, WD = D.words;
const GOLD = '#F2B544', CREAM = '#F6EEDC', EMBER = '#FF9B54', INDIGO = '#0B1026';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const wt = i => WD[i].s;
const BOOM = (D.boom || [])[0] ?? -99;   // hook impact time (video.json "boom")

// ---------------- clips (LTX frames) + stills ----------------
// key: [klip folder name, still fallback]
const CL = {
  h01: ['h01', 'ai/h01_el_tas_s42.jpg'], h02: ['h02', 'ai/h02_tas_gok_s7.jpg'],
  s01a: ['s01a', 'ai/s01a_spinoza_yazar_s7.jpg'], s01b: ['s01b', 'ai/s01b_pencere_tas_s7.jpg'],
  s02a: ['s02a', 'ai/s02a_kral_tanri_s42.jpg'], s02b: ['s02b', 'ai/s02b_fresk_insanlar_s7.jpg'], s02c: ['s02c', 'ai/s02c_prizma_s7.jpg'],
  s03a: ['s03a', 'ai/s03a_yaprak_s7.jpg'], s03b: ['s03b', 'ai/s03b_orman_deniz_s7.jpg'], s03c: ['s03c', 'ai/s03c_dalga_insan_s7.jpg'], s03d: ['s03d', 'ai/s03d_yildizlar_s7.jpg'],
  s04a: ['s04a', 'ai/s04a_koylu_gunes_s42.jpg'], s04b: ['s04b', 'ai/s04b_yagmur_tarla_s7.jpg'], s04c: ['s04c', 'ai/s04c_disliler_s7.jpg'],
  s05a: ['s05a', 'ai/s05a_filiz_s7.jpg'], s05b: ['s05b', 'ai/s05b_spinoza_pencere_s42.jpg'], s05c: ['s05c', 'ai/s05c_rihtim_s7.jpg'],
  s06a: ['s06a', 'ai/s06a_ofke_yuz_s42.jpg'], s06b: ['s06b', 'ai/s06b_zincir_el_s42.jpg'],
  s07a: ['s07a', 'ai/s07a_spinoza_isik_s7.jpg'], s07b: ['s07b', 'ai/s07b_sehir_isik_s7.jpg'], s08a: ['s08a', 'ai/s08a_el_tas_avuc_s42.jpg'],
  g01: ['g01', 'gercek/01-spinoza-portre-1665.jpg'], g02: ['g02', 'gercek/Einstein_1921_by_F_Schmutzer_-_restoration.jpg'],
};
const CLIP_FPS = 24, CLIP_N = 97, BASE = '../gorseller/';
const CLMAX = { h01: 64, s04a: 72, s03a: 88, s07a: 80 };
const NOCLIP = new Set(['s06a']);   // LTX artifact on the face: use the still with camera motion   // usable frames per clip (LTX degrades late in some clips)
const G = {}, CACHE = new Map(), HAS = {};
function loadImg(src) { return new Promise(ok => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = src; }); }
async function getImg(src) { if (CACHE.has(src)) { const v = CACHE.get(src); CACHE.delete(src); CACHE.set(src, v); return v; }
  const im = await loadImg(src); CACHE.set(src, im); if (CACHE.size > 260) CACHE.delete(CACHE.keys().next().value); return im; }
async function prep() {
  for (const [k, [dir, still]] of Object.entries(CL)) { G[k] = await loadImg(BASE + still); HAS[k] = !NOCLIP.has(k) && await fetch(BASE + 'klip/' + dir + '/done').then(r => r.ok).catch(() => false); }
  G.grain = [0, 1, 2, 3].map(s => { const c = document.createElement('canvas'); c.width = 540; c.height = 960; const x = c.getContext('2d'); const d = x.createImageData(540, 960); const r = rng(77 + s);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });
}
function clipIdx(lt, d, n = CLIP_N) {   // fill the shot: slow the clip down (to 0.55x), then ping-pong
  const r = clamp((n / CLIP_FPS) / Math.max(d, 0.01), 0.55, 1); let i = Math.floor(lt * CLIP_FPS * r); const P = 2 * (n - 1); i = ((i % P) + P) % P; return i < n ? i : P - i;
}
function frameSrc(s, t) { const [dir] = CL[s.k]; if (!HAS[s.k]) return null; const lt = Math.max(0, t - s.t0); return BASE + 'klip/' + dir + '/' + String(clipIdx(lt, s.t1 - s.t0, CLMAX[s.k] || CLIP_N)).padStart(3, '0') + '.jpg'; }
function drawImg(im, u, v, z, rot = 0, filter = 'none') {
  const iw = im.width, ih = im.height, s = Math.max(W / iw, H / ih) * z;
  ctx.save(); ctx.filter = filter; ctx.translate(W / 2, H / 2); if (rot) ctx.rotate(rot);
  const dw = iw * s, dh = ih * s; const ox = clamp(u * dw - W / 2, 0, dw - W), oy = clamp(v * dh - H / 2, 0, dh - H);
  ctx.drawImage(im, -W / 2 - ox, -H / 2 - oy, dw, dh); ctx.restore(); ctx.filter = 'none';
}

// ---------------- motion layers ----------------
const DROPS = (() => { const r = rng(9), a = []; for (let i = 0; i < 160; i++) a.push({ x: r(), y: r(), s: r() }); return a; })();
function rain(t, amt) {
  ctx.save(); ctx.strokeStyle = 'rgba(200,215,255,0.35)'; ctx.lineWidth = 2;
  for (const d of DROPS) { const sp = 900 + d.s * 900, y = ((d.y * H + t * sp) % (H + 200)) - 100, x = d.x * W - (y / H) * 60, l = 30 + d.s * 60;
    ctx.globalAlpha = amt * (0.3 + d.s * 0.6); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 8, y + l); ctx.stroke(); }
  ctx.restore();
}
const MOTES = (() => { const r = rng(33), a = []; for (let i = 0; i < 120; i++) a.push({ x: r(), y: r(), s: r(), p: r() * 6.28 }); return a; })();
function motes(t, amt) {
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const m of MOTES) { const x = ((m.x + Math.sin(t * 0.2 + m.p) * 0.03 + t * 0.004 * (m.s - 0.5)) % 1 + 1) % 1 * W, y = ((m.y - t * 0.01 * (0.3 + m.s)) % 1 + 1) % 1 * H, r = 1.5 + m.s * 3.5;
    ctx.globalAlpha = amt * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 2 + m.p))); ctx.fillStyle = '#FFD58A'; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
function godRays(t, amt, cx = 0.7, cy = 0.05) {
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.translate(cx * W, cy * H);
  for (let i = 0; i < 7; i++) { const a = 0.35 + i * 0.13 + Math.sin(t * 0.3 + i) * 0.03; ctx.rotate(0); const g = ctx.createLinearGradient(0, 0, Math.cos(a + 1.2) * 1800, Math.sin(a + 1.2) * 1800);
    g.addColorStop(0, `rgba(255,210,130,${0.16 * amt})`); g.addColorStop(1, 'rgba(255,210,130,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a + 1.2 - 0.04) * 2200, Math.sin(a + 1.2 - 0.04) * 2200); ctx.lineTo(Math.cos(a + 1.2 + 0.04) * 2200, Math.sin(a + 1.2 + 0.04) * 2200); ctx.fill(); }
  ctx.restore();
}


function stone(x, y, R, rot, a = 1) {   // code-drawn river stone with warm rim light
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 20;
  const g = ctx.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.1, 0, 0, R * 1.1); g.addColorStop(0, '#9a958c'); g.addColorStop(0.55, '#5d5850'); g.addColorStop(1, '#23201c');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, R, R * 0.78, 0, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  const r = rng(11); ctx.globalAlpha = a * 0.25; for (let i = 0; i < 140; i++) { const px = (r() - 0.5) * 1.8 * R, py = (r() - 0.5) * 1.4 * R; if ((px / R) ** 2 + (py / (R * 0.78)) ** 2 > 0.9) continue; ctx.fillStyle = r() > 0.5 ? '#c8c2b5' : '#1b1814'; ctx.fillRect(px, py, 3, 3); }
  ctx.globalAlpha = a; ctx.globalCompositeOperation = 'screen'; ctx.strokeStyle = 'rgba(255,200,120,0.55)'; ctx.lineWidth = R * 0.06; ctx.beginPath(); ctx.ellipse(0, 0, R * 0.97, R * 0.76, 0, 3.6, 5.8); ctx.stroke();
  ctx.restore();
}
function causeWeb(t, lt, amt) {   // threads of causes converging on the stone (centre)
  const r = rng(58); ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.lineWidth = 3;
  for (let i = 0; i < 26; i++) { const a = r() * 6.283, L = 380 + r() * 700, k = ease((lt - 0.2 - i * 0.07) / 1.2); if (k <= 0) continue;
    const x0 = W / 2 + Math.cos(a) * L, y0 = H * 0.45 + Math.sin(a) * L, x1 = lerp(x0, W / 2, k), y1 = lerp(y0, H * 0.45, k);
    const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, 'rgba(242,181,68,0)'); g.addColorStop(1, `rgba(255,214,140,${0.75 * amt})`);
    ctx.strokeStyle = g; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo((x0 + x1) / 2 + Math.sin(t + i) * 40, (y0 + y1) / 2, x1, y1); ctx.stroke();
    ctx.fillStyle = `rgba(255,226,170,${0.9 * amt * k})`; ctx.beginPath(); ctx.arc(x0, y0, 5, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
function triangle(t, lt) {   // a glowing triangle drawn by the prism light
  const k = ease((lt - 0.4) / 1.6); if (k <= 0) return; const cx = W / 2, cy = 760, R = 300 + 10 * Math.sin(t * 1.5);
  const P = [0, 1, 2].map(i => [cx + Math.cos(-Math.PI / 2 + i * 2.094) * R, cy + Math.sin(-Math.PI / 2 + i * 2.094) * R]);
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.strokeStyle = 'rgba(255,214,140,0.9)'; ctx.lineWidth = 7; ctx.shadowColor = 'rgba(255,180,80,0.9)'; ctx.shadowBlur = 40;
  ctx.setLineDash([2400 * k, 2400]); ctx.beginPath(); ctx.moveTo(...P[0]); ctx.lineTo(...P[1]); ctx.lineTo(...P[2]); ctx.closePath(); ctx.stroke(); ctx.restore();
}

// ---------------- text cards ----------------
function cardText(lines, lt, { y = 820, size = 120, color = CREAM, sub = null, subColor = GOLD, font = 'Anton', fade = 0.35, band = 0.45, w = 400 } = {}) {
  const a = fade ? ease(lt / fade) : 1;
  if (band) { const g = ctx.createLinearGradient(0, y - size * 1.9, 0, y + size * (lines.length + 0.6)); g.addColorStop(0, 'rgba(5,6,18,0)'); g.addColorStop(0.3, `rgba(5,6,18,${band * a})`); g.addColorStop(0.7, `rgba(5,6,18,${band * a})`); g.addColorStop(1, 'rgba(5,6,18,0)'); ctx.fillStyle = g; ctx.fillRect(0, y - size * 1.9, W, size * (lines.length + 2.5)); }
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  lines.forEach((s, i) => { let sz = size; ctx.font = `${font === 'Anton' ? '' : '900 '}${sz}px ${font}`; const mw = ctx.measureText(s).width; if (mw > 980) { sz = Math.floor(sz * 980 / mw); ctx.font = `${font === 'Anton' ? '' : '900 '}${sz}px ${font}`; }
    const yy = y + i * size * 1.08 + (fade ? (1 - a) * 20 : 0); ctx.lineWidth = sz * 0.09; ctx.strokeStyle = 'rgba(6,6,16,0.9)'; ctx.strokeText(s, W / 2, yy);
    ctx.fillStyle = Array.isArray(color) ? color[i] : color; ctx.shadowColor = 'rgba(242,181,68,0.5)'; ctx.shadowBlur = 34; ctx.fillText(s, W / 2, yy); ctx.shadowBlur = 0; });
  if (sub) { ctx.font = '700 42px Cinzel'; ctx.fillStyle = subColor; ctx.fillText(sub, W / 2, y - size * 1.0); ctx.fillRect(W / 2 - 70, y - size * 1.0 + 22, 140, 3); }
  ctx.restore();
}

// ---------------- shot list ----------------
// [startWord, clip, from[u,v,z], to[u,v,z], fx, card]
const SH = [
  [0, 'h01', [0.5, 0.5, 1.0], [0.5, 0.45, 1.06], 'none'],
  [4, 'h02', [0.5, 0.5, 1.06], [0.5, 0.5, 1.0], 'hang'],
  [-1, 'h02', [0.5, 0.55, 1.2], [0.5, 0.5, 1.05], 'boom'],
  [8, 's01a', [0.5, 0.45, 1.08], [0.5, 0.4, 1.0], 'motes', 'spinoza'],
  [12, 's01b', [0.5, 0.5, 1.0], [0.5, 0.5, 1.08], 'none'],
  [17, 'g01', [0.5, 0.4, 1.0], [0.5, 0.35, 1.1], 'motes'],
  [26, 's02b', [0.5, 0.4, 1.12], [0.5, 0.5, 1.0], 'motes'],
  [31, 's02a', [0.5, 0.45, 1.0], [0.5, 0.4, 1.1], 'rays'],
  [38, 's02c', [0.5, 0.5, 1.05], [0.5, 0.45, 1.15], 'tri', 'ucgen'],
  [46, 's02a', [0.5, 0.4, 1.1], [0.5, 0.35, 1.25], 'fadeKing'],
  [50, 's03a', [0.5, 0.5, 1.0], [0.5, 0.5, 1.12], 'motes', 'deus'],
  [56, 's03b', [0.5, 0.5, 1.08], [0.5, 0.45, 1.0], 'none'],
  [61, 's03d', [0.5, 0.45, 1.0], [0.5, 0.5, 1.08], 'motes'],
  [66, 's03c', [0.5, 0.5, 1.05], [0.5, 0.5, 1.15], 'none', 'dalga'],
  [71, 'g02', [0.5, 0.35, 1.0], [0.5, 0.3, 1.1], 'bw', 'einstein'],
  [80, 's04c', [0.5, 0.5, 1.0], [0.5, 0.5, 1.12], 'motes', 'mucize'],
  [88, 's04a', [0.5, 0.4, 1.05], [0.5, 0.35, 1.0], 'rays'],
  [93, 's04b', [0.5, 0.5, 1.0], [0.5, 0.55, 1.1], 'rain', 'dunya'],
  [102, 's05a', [0.5, 0.55, 1.1], [0.5, 0.5, 1.0], 'motes', 'conatus'],
  [111, 's05b', [0.5, 0.4, 1.0], [0.5, 0.38, 1.08], 'rays', 'sevinc'],
  [119, 's05c', [0.5, 0.5, 1.05], [0.5, 0.5, 1.0], 'none'],
  [129, 'h02', [0.5, 0.5, 1.15], [0.5, 0.48, 1.3], 'causes'],
  [138, 's06a', [0.5, 0.45, 1.0], [0.5, 0.45, 1.1], 'none'],
  [148, 's06b', [0.5, 0.5, 1.08], [0.5, 0.5, 1.0], 'motes', 'ozgurluk'],
  [154, 's07a', [0.5, 0.45, 1.0], [0.5, 0.42, 1.1], 'rays'],
  [160, 's07b', [0.5, 0.5, 1.0], [0.5, 0.55, 1.1], 'motes'],
  [167, 's03c', [0.5, 0.5, 1.15], [0.5, 0.5, 1.0], 'gold', 'tek'],
  [174, 's01a', [0.5, 0.42, 1.05], [0.5, 0.4, 1.15], 'motes', 'ogut'],
  [183, 's08a', [0.5, 0.5, 1.0], [0.5, 0.5, 1.1], 'anla', 'anla'],
  [-2, 's08a', [0.5, 0.5, 1.1], [0.5, 0.5, 1.14], 'end', 'end'],
];
const END_T = 117.6;
const SHOTS = SH.map((s, i) => ({ t0: i === 0 ? 0 : s[0] === -1 ? BOOM : s[0] === -2 ? END_T : wt(s[0]) - 0.12, k: s[1], a: s[2], b: s[3], fx: s[4], card: s[5] }));
SHOTS.forEach((s, i) => s.t1 = i + 1 < SHOTS.length ? SHOTS[i + 1].t0 : DUR + 0.5);
function drawShot(s, t, im) {
  const lt = t - s.t0, d = s.t1 - s.t0, e = ease((lt + 0.3) / (d + 0.6));
  let u = lerp(s.a[0], s.b[0], e), v = lerp(s.a[1], s.b[1], e), z = lerp(s.a[2], s.b[2], e), filt = 'none';
  if (s.fx === 'bw') filt = 'sepia(0.35) contrast(1.05)';
  if (s.fx === 'gold') filt = 'sepia(0.45) saturate(1.5) brightness(1.08)';
  if (s.fx === 'fadeKing') filt = `brightness(${lerp(1, 0.35, ease(lt / d))}) blur(${lerp(0, 6, ease(lt / d))}px)`;
  if (s.fx === 'causes') filt = 'brightness(0.75) saturate(0.8)';
  if (s.fx === 'boom') { const sh = Math.max(0, 1 - lt / 0.6) * 26; ctx.save(); ctx.translate(Math.sin(t * 90) * sh, Math.cos(t * 77) * sh); }
  drawImg(im || G[s.k], u, v, z, 0, filt);
  if (s.fx === 'boom') ctx.restore();
  if (s.fx === 'motes') motes(t, 0.7);
  if (s.fx === 'rays') { godRays(t, 0.9); motes(t, 0.5); }
  if (s.fx === 'rain') rain(t, 0.8);
  if (s.fx === 'tri') { triangle(t, lt); motes(t, 0.5); }
  if (s.fx === 'fadeKing') motes(t, 0.9 * ease(lt / d));
  if (s.fx === 'causes') { causeWeb(t, lt, 1); stone(W / 2, H * 0.45, 120, 0.2 + 0.1 * Math.sin(t * 0.8)); }
  if (s.fx === 'hang') { motes(t, 0.7); stone(W / 2, H * 0.36 + 10 * Math.sin(t * 2), 110, t * 0.6); }
  if (s.fx === 'boom') { const f = Math.min(lt, 1.6); stone(W / 2, H * 0.36 + 900 * f * f, 110, t * 0.6 + lt * 3); }
  if (s.fx === 'gold') { godRays(t, 0.8, 0.5, 0.0); motes(t, 0.9); }
  if (s.fx === 'anla') { ctx.fillStyle = `rgba(0,0,0,${0.55 * ease((lt - 0.2) / 0.6)})`; ctx.fillRect(0, 0, W, H); }
  if (s.fx === 'end') { ctx.fillStyle = `rgba(5,6,18,${lerp(0.55, 0.8, ease(lt / 0.6))})`; ctx.fillRect(0, 0, W, H); motes(t, 0.6); }
  if (s.card) drawCard(s.card, lt, d, t);
}
function ytIcon(x, y, s, a) {
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#FF0033'; const w = s * 1.42, h = s; const r = h * 0.28;
  ctx.beginPath(); ctx.moveTo(x - w / 2 + r, y - h / 2); ctx.arcTo(x + w / 2, y - h / 2, x + w / 2, y + h / 2, r); ctx.arcTo(x + w / 2, y + h / 2, x - w / 2, y + h / 2, r); ctx.arcTo(x - w / 2, y + h / 2, x - w / 2, y - h / 2, r); ctx.arcTo(x - w / 2, y - h / 2, x + w / 2, y - h / 2, r); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - h * 0.17, y - h * 0.24); ctx.lineTo(x + h * 0.27, y); ctx.lineTo(x - h * 0.17, y + h * 0.24); ctx.fill(); ctx.restore();
}
function at(i, t) { return t - wt(i) + 0.1; }
function drawCard(c, lt, d, t) {
  if (c === 'spinoza') cardText(['BARUCH SPINOZA'], lt - 0.3, { y: 400, size: 120, sub: '1632 · 1677' });
  if (c === 'ucgen') cardText(['TANRI', 'BİR ÜÇGEN OLURDU'], at(42, t), { y: 1500, size: 96, color: [CREAM, GOLD], band: 0.4 });
