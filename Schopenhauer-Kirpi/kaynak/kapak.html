<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Kapak Schopenhauer Kirpi</title>
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Baskerville;font-weight:900;src:url(fonts/cinzel-latin-900.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Baskerville;font-weight:900;src:url(fonts/cinzel-latin-ext-900.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF}
html,body{margin:0;background:#000}canvas{display:block;width:360px;height:640px}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const load = s => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(s); im.src = '../gorseller/' + s; });
function cover(im, u, v, z) { const s = Math.max(W / im.width, H / im.height) * z, dw = im.width * s, dh = im.height * s; const ox = Math.max(0, Math.min(dw - W, u * dw - W / 2)), oy = Math.max(0, Math.min(dh - H, v * dh - H / 2)); ctx.drawImage(im, -ox, -oy, dw, dh); }
function line(s, y, size, fill, glow) { ctx.font = `${size}px Anton`; let sz = size; const mw = ctx.measureText(s).width; if (mw > 980) { sz = Math.floor(size * 980 / mw); ctx.font = `${sz}px Anton`; }
  ctx.lineJoin = 'round'; ctx.lineWidth = sz * 0.11; ctx.strokeStyle = 'rgba(6,6,14,0.95)'; ctx.strokeText(s, W / 2, y); ctx.fillStyle = fill; ctx.shadowColor = glow; ctx.shadowBlur = 40; ctx.fillText(s, W / 2, y); ctx.shadowBlur = 0; }
async function draw() {
  const p = await load('flow/c1_yasli_arthur.jpg'), k = await load('flow/v1_dikenler.jpg');
  cover(p, 0.5, 0.36, 1.08);
  // lower third: the two hedgehogs, quills touching, fading up into the portrait
  ctx.save(); ctx.globalAlpha = 0.95; const g0 = ctx.createLinearGradient(0, 1180, 0, 1460);
  const c2 = document.createElement('canvas'); c2.width = W; c2.height = 760; const x2 = c2.getContext('2d'); const s = W / k.width; x2.drawImage(k, 0, -k.height * s * 0.38, W, k.height * s);
  const m = x2.createLinearGradient(0, 0, 0, 260); m.addColorStop(0, 'rgba(0,0,0,1)'); m.addColorStop(1, 'rgba(0,0,0,0)'); x2.globalCompositeOperation = 'destination-out'; x2.fillStyle = m; x2.fillRect(0, 0, W, 260);
  ctx.drawImage(c2, 0, 1160); ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.35, W / 2, H * 0.5, H * 0.8); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(8,12,28,0.6)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const b = ctx.createLinearGradient(0, 860, 0, 1420); b.addColorStop(0, 'rgba(6,8,18,0)'); b.addColorStop(0.35, 'rgba(6,8,18,0.62)'); b.addColorStop(1, 'rgba(6,8,18,0.25)'); ctx.fillStyle = b; ctx.fillRect(0, 860, W, 560);
  ctx.textAlign = 'center';
  ctx.font = '900 46px Baskerville'; ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(6,6,14,0.9)'; ctx.strokeText("SCHOPENHAUER'IN KİRPİ İKİLEMİ", W / 2, 1000); ctx.fillStyle = '#F2B544'; ctx.fillText("SCHOPENHAUER'IN KİRPİ İKİLEMİ", W / 2, 1000);
  ctx.fillRect(W / 2 - 90, 1022, 180, 4);
  line('EN YAKININ', 1170, 168, '#F6EEDC', 'rgba(255,183,3,0.5)');
  line('NEDEN CANINI YAKAR?', 1330, 150, '#FF5A4A', 'rgba(230,40,40,0.55)');
}
window.captureFrame = async (f, type = 'image/png', q = 0.95) => cv.toDataURL(type, q);
window.READY = (async () => { await Promise.all(['168px Anton', '900 46px Baskerville'].map(f => document.fonts.load(f, 'ŞİĞÜÖÇışğüöç'))); await draw(); return { frames: 1, fps: 1, width: W, height: H, renderer: 'canvas' }; })();
</script></body></html>
