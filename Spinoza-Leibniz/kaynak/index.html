<style>

</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="words.js"></script>
<script>
// Spinoza ve Leibniz, Lahey 1676. Imza: mercekten kirilan altin isik (prizmatik huzme), Cinzel izli tipografi.
const W = 1080, H = 1920, FPS = 30, DUR = window.DATA.duration, FRAMES = Math.round(DUR * FPS);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const D = window.DATA, WD = D.words;
const AMBER = '#E9B45A', CREAM = '#F4EBD9', PRISM = ['rgba(255,90,60,', 'rgba(255,214,120,', 'rgba(110,170,255,'];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const eo = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const wt = i => WD[i].s, T = i => WD[i].s - 0.12;

// ---------------- images ----------------
const IMG = {
  mumH: 'ai/a02_mum_s23.jpg', mum: 'ai/a02_mum_s11.jpg', sokak: 'ai/a01_sokak_s11.jpg', mercek: 'ai/a03_mercek_s11.jpg', mercek2: 'ai/a03_mercek_s23.jpg',
  tas: 'ai/a04_tas_s11.jpg', yazma: 'ai/a05_elyazma_s11.jpg', yazma2: 'ai/a05_elyazma_s23.jpg', tarla: 'ai/a06_tarla_s11.jpg', tarla2: 'ai/a06_tarla_s23.jpg', pencere: 'ai/a08_pencere_s11.jpg',
  spPD: 'arsiv/spinoza-pd.jpg', lbPD: 'arsiv/leibniz-pd.jpg',
  spTas: 'flow/f00_spinoza_tas.jpg', lbOfke: 'flow/f01_leibniz_ofke.jpg', lbYum: 'flow/f02_leibniz_yumusak.jpg', lbDin: 'flow/f03_leibniz_dinler.jpg', spBak: 'flow/f04_spinoza_bakis.jpg',
  spDin: 'flow/f05_spinoza_dinler.jpg', omuz: 'flow/f06_omuz_ustu.jpg', kapi: 'flow/f07_kapi.jpg', merIsik: 'flow/f08_mercek_isik.jpg', spYakin: 'flow/f09_spinoza_tas_yakin.jpg' };
// Veo konusan klipler: kelime capalari (vo_sn -> klip_sn), 24 fps kareler
const SYNC = {
  v1_spinoza_tas: [[18.23,0.09],[18.64,0.5],[19.02,0.9],[19.2,1.12],[19.66,1.42],[20.34,2.44],[20.88,2.98],[21.58,3.78],[22.2,4.98],[22.92,5.7]],
  v2_leibniz_hapishane: [[33.1,0.62],[33.28,0.8],[33.46,0.98],[34.16,1.84],[34.8,3.1],[35.24,3.58],[35.5,3.88],[35.94,4.66],[36.08,4.9],[36.44,5.38],[36.74,5.86]],
  v3_spinoza_eksik: [[59.16,0],[59.94,0.44],[60.14,0.56],[60.52,0.96],[60.74,1.18],[61.52,2.04],[61.92,2.5],[62.16,2.82],[62.78,3.42],[63.3,4.4],[63.94,5.12],[64.14,5.28],[64.8,5.76],[65.08,6.0],[65.34,6.32]],
  v4_leibniz_senfoni: [[72.86,0],[73.22,0.16],[73.74,0.84],[74.24,1.38],[74.56,1.78],[75.14,2.5],[75.44,4.18],[75.7,4.52],[76.38,5.42]] };
const CLIPN = 188;
function clipTime(name, t) {
  const A = SYNC[name]; if (t <= A[0][0]) return Math.max(0, A[0][1] + (t - A[0][0]));
  for (let i = 1; i < A.length; i++) if (t <= A[i][0]) { const [a0, c0] = A[i - 1], [a1, c1] = A[i]; return c0 + (c1 - c0) * (t - a0) / (a1 - a0); }
  const L = A[A.length - 1]; return L[1] + (t - L[0]);
}
const clipFrame = (name, t) => clamp(Math.round(clipTime(name, t) * 24) + 1, 1, CLIPN);
const G = {}, CACHE = new Map();
function loadImg(src) { return new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(src); im.src = '../gorseller/' + src; }); }
async function clipImg(name, n) {
  const key = name + n; if (CACHE.has(key)) return CACHE.get(key);
  const im = await loadImg(`klip/${name}/${String(n).padStart(4, '0')}.jpg`); CACHE.set(key, im);
  if (CACHE.size > 16) CACHE.delete(CACHE.keys().next().value); return im;
}
async function prep() {
  for (const [k, s] of Object.entries(IMG)) G[k] = await loadImg(s);
  G.grain = [0, 1, 2, 3].map(s => { const c = document.createElement('canvas'); c.width = 540; c.height = 960; const x = c.getContext('2d'); const d = x.createImageData(540, 960); const r = rng(1676 + s);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });
  const mk = (c0, c1) => { const p = document.createElement('canvas'); p.width = p.height = 128; const px = p.getContext('2d'); const g = px.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, c0); g.addColorStop(0.5, c1); g.addColorStop(1, 'rgba(0,0,0,0)'); px.fillStyle = g; px.fillRect(0, 0, 128, 128); return p; };
  G.glow = mk('rgba(255,222,160,0.9)', 'rgba(255,180,90,0.25)');
  { const im = G.tas, c = document.createElement('canvas'); c.width = 570; c.height = 960; const x = c.getContext('2d');
    x.drawImage(im, 110, 200, 570, 960, 0, 0, 570, 960); x.globalCompositeOperation = 'destination-in';
    x.save(); x.translate(285, 480); x.scale(1, 960 / 570); const g = x.createRadialGradient(0, 0, 0, 0, 0, 285); g.addColorStop(0, '#000'); g.addColorStop(0.82, '#000'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(-285, -285, 570, 570); x.restore(); G.stone = c; }
  G.smoke = mk('rgba(200,200,205,0.30)', 'rgba(170,170,180,0.10)');
}
// cover crop of an image into a rect; u,v = focus (0..1), z = zoom
function drawImg(im, u, v, z, rx = 0, ry = 0, rw = W, rh = H, filter = 'none', rot = 0) {
  const iw = im.width, ih = im.height, s = Math.max(rw / iw, rh / ih) * z, dw = iw * s, dh = ih * s;
  const ox = clamp(u * dw - rw / 2, 0, dw - rw), oy = clamp(v * dh - rh / 2, 0, dh - rh);
  ctx.save(); ctx.beginPath(); ctx.rect(rx, ry, rw, rh); ctx.clip(); ctx.filter = filter;
  if (rot) { ctx.translate(rx + rw / 2, ry + rh / 2); ctx.rotate(rot); ctx.translate(-(rx + rw / 2), -(ry + rh / 2)); }
  ctx.drawImage(im, rx - ox, ry - oy, dw, dh); ctx.restore();
}

// ---------------- light & air ----------------
const flick = (t, s = 0) => 0.86 + 0.08 * Math.sin(t * 11.3 + s) + 0.05 * Math.sin(t * 23.7 + s * 2) + 0.03 * Math.sin(t * 41 + s * 3);
function glowAt(x, y, r, a) { ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = clamp(a, 0, 1); ctx.drawImage(G.glow, x - r, y - r, r * 2, r * 2); ctx.restore(); }
const MOTES = (() => { const r = rng(1632), a = []; for (let i = 0; i < 110; i++) a.push({ x: r(), y: r(), s: r(), p: r() * 6.28 }); return a; })();
function motes(t, amt) {
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = '#FFD99A';
  for (const m of MOTES) { const x = (((m.x + Math.sin(t * 0.17 + m.p) * 0.04 + t * 0.003 * (m.s - 0.5)) % 1) + 1) % 1 * W, y = (((m.y - t * 0.008 * (0.3 + m.s)) % 1) + 1) % 1 * H, r = 1.2 + m.s * 3;
    ctx.globalAlpha = amt * (0.25 + 0.6 * (0.5 + 0.5 * Math.sin(t * 1.7 + m.p))); ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
const DROPS = (() => { const r = rng(1676), a = []; for (let i = 0; i < 220; i++) a.push({ x: r(), y: r(), s: r() }); return a; })();
function rain(t, amt, slant = 70, col = '200,214,240') {
  ctx.save(); ctx.strokeStyle = `rgba(${col},0.4)`; ctx.lineWidth = 2;
  for (const d of DROPS) { const sp = 1300 + d.s * 1100, y = ((d.y * (H + 300) + t * sp) % (H + 300)) - 150, x = d.x * (W + 200) - 100 - (y / H) * slant, l = 34 + d.s * 70;
    ctx.globalAlpha = amt * (0.2 + d.s * 0.6); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - slant * l / 900, y + l); ctx.stroke(); }
  ctx.restore();
}
// imza: mercekten kirilan prizmatik huzme (ana cizgi + kirmizi/altin/mavi kenarlar)
function beam(cx, cy, ang, len, width, a) {
  if (a <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(cx, cy); ctx.rotate(ang);
  [[-width * 0.5, 0], [0, 1], [width * 0.5, 2]].forEach(([off, c]) => {
    const g = ctx.createLinearGradient(0, off - width, 0, off + width); g.addColorStop(0, PRISM[c] + '0)'); g.addColorStop(0.5, PRISM[c] + (c === 1 ? 0.55 : 0.28) * a + ')'); g.addColorStop(1, PRISM[c] + '0)');
    const fg = ctx.createLinearGradient(0, 0, len, 0); ctx.fillStyle = g; ctx.globalAlpha = 1; ctx.fillRect(0, off - width, len, width * 2); });
  ctx.restore();
}
function sweep(t, t0) {   // gecis: huzme ekranin capraz ekseninden supurur, ortada mercek parlamasi
  const k = (t - t0 + 0.32) / 0.7; if (k < 0 || k > 1) return;
  const x = lerp(-300, W + 300, eo(k)), a = Math.sin(Math.PI * k);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.translate(x, H * 0.5); ctx.rotate(0.32);
  for (let c = 0; c < 3; c++) { const off = (c - 1) * 46, g = ctx.createLinearGradient(off - 160, 0, off + 160, 0);
    g.addColorStop(0, PRISM[c] + '0)'); g.addColorStop(0.5, PRISM[c] + (c === 1 ? 0.75 : 0.4) * a + ')'); g.addColorStop(1, PRISM[c] + '0)'); ctx.fillStyle = g; ctx.fillRect(off - 160, -1400, 320, 2800); }
  ctx.restore();
  glowAt(x, H * 0.5, 420 * a + 60, 0.7 * a);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(255,220,160,${0.35 * a})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, H * 0.5, 150 + 260 * k, 0, 6.283); ctx.stroke(); ctx.restore();
}
function caustic(t, x, y, a) {  // merceğin yüze düşürdüğü kırılmış ışık lekesi
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let c = 0; c < 3; c++) { const ox = (c - 1) * 14, r = 120 + 10 * Math.sin(t * 1.3 + c);
    const g = ctx.createRadialGradient(x + ox, y, r * 0.2, x + ox, y, r); g.addColorStop(0, PRISM[c] + (c === 1 ? 0.32 : 0.12) * a + ')'); g.addColorStop(0.75, PRISM[c] + 0.16 * a + ')'); g.addColorStop(1, PRISM[c] + '0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x + ox, y, r * 1.25, r, 0.4, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
const SMK = (() => { const r = rng(90), a = []; for (let i = 0; i < 40; i++) a.push({ p: r(), s: r(), w: r() * 6.28 }); return a; })();
function smoke(t, lt, x, y, amt) {
  if (lt < 0) return; ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const f of SMK) { const life = 3.5, ph = ((lt / life) + f.p * 0.6); if (ph > 1.6) continue; const k = clamp(ph, 0, 1);
    const yy = y - k * 900 * (0.6 + f.s * 0.6), xx = x + Math.sin(t * 0.8 + f.w + k * 4) * 90 * k, r = 40 + 260 * k * (0.5 + f.s);
    ctx.globalAlpha = amt * Math.sin(Math.PI * k) * 0.45; ctx.drawImage(G.smoke, xx - r, yy - r, r * 2, r * 2); }
  ctx.restore();
}
const WORLDS = (() => { const r = rng(1710), a = []; for (let i = 0; i < 140; i++) a.push({ x: r(), y: r(), s: r(), p: r() * 6.28 }); return a; })();
function worlds(t, k, cx, cy) {  // sayisiz dunya noktasi tek isikta toplanir
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const m of WORLDS) { const kk = eo(clamp((k - m.s * 0.35) / 0.65, 0, 1)); const x = lerp(m.x * W, cx, kk), y = lerp(m.y * H, cy, kk);
    ctx.globalAlpha = (1 - kk * 0.85) * (0.45 + 0.4 * Math.sin(t * 2 + m.p)); ctx.fillStyle = m.s > 0.6 ? '#9CC4FF' : '#FFD38A'; ctx.beginPath(); ctx.arc(x, y, 2 + m.s * 4, 0, 6.283); ctx.fill(); }
  ctx.restore(); glowAt(cx, cy, 90 + 260 * k, 0.25 + 0.6 * k);
}

// ---------------- shot list ----------------
// [t0, image|clip, from[u,v,z], to[u,v,z], fx, joint]  joint: 'c' cut, 'x' dissolve, 'L' lens sweep
const SH = [
  [0, 'mumH', [0.5, 0.42, 1.12], [0.5, 0.4, 1.3], 'hook', 'c'],
  [3.0, 'spPD', [0.5, 0.36, 1.05], [0.5, 0.3, 1.2], 'archive', 'x'],
  [T(9), 'spYakin', [0.62, 0.36, 1.45], [0.62, 0.34, 1.25], 'hayir', 'c'],
  [T(10), 'sokak', [0.5, 0.78, 1.18], [0.5, 0.42, 1.05], 'street', 'L'],
  [T(12), 'mercek', [0.5, 0.5, 1.45], [0.5, 0.48, 1.12], 'motes', 'x'],
  [T(17), 'mum', [0.5, 0.55, 1.0], [0.5, 0.42, 1.22], 'candle', 'c'],
  [T(21), 'kapi', [0.38, 0.62, 1.05], [0.6, 0.5, 1.25], 'door', 'x'],
  [T(28), 'lbPD', [0.5, 0.34, 1.22], [0.5, 0.33, 1.06], 'archive', 'c'],
  [17.9, '@v1_spinoza_tas', [0.5, 0.5, 1.0], [0.5, 0.45, 1.06], 'clip', 'L'],
  [T(38), 'lbDin', [0.5, 0.36, 1.08], [0.5, 0.32, 1.28], 'motes', 'c'],
  [T(42), 'tas', [0.5, 0.5, 1.15], [0.5, 0.5, 1.3], 'float', 'x'],
  [T(46), 'omuz', [0.66, 0.48, 1.12], [0.44, 0.48, 1.12], 'motes', 'c'],
  [T(49), 'spTas', [0.4, 0.4, 1.35], [0.38, 0.42, 1.1], 'candleL', 'c'],
  [32.6, '@v2_leibniz_hapishane', [0.5, 0.48, 1.08], [0.5, 0.45, 1.0], 'clip', 'L'],
  [T(66), 'spDin', [0.48, 0.4, 1.05], [0.48, 0.36, 1.25], 'candleL', 'c'],
  [T(71), 'tas', [0.5, 0.5, 1.4], [0.5, 0.56, 1.25], 'drop', 'c'],
  [T(79), 'yazma', [0.35, 0.62, 1.32], [0.58, 0.5, 1.12], 'motes', 'x'],
  [T(84), 'spBak', [0.55, 0.36, 1.32], [0.55, 0.4, 1.08], 'candleL', 'c'],
  [48.3, 'merIsik', [0.5, 0.5, 1.02], [0.44, 0.45, 1.22], 'lensbeam', 'L'],
  [T(100), 'lbOfke', [0.5, 0.3, 1.22], [0.5, 0.29, 1.36], 'caustic', 'c'],
  [T(104), 'tarla', [0.5, 0.36, 1.02], [0.5, 0.56, 1.14], 'field', 'x'],
  [T(109), 'tarla2', [0.5, 0.5, 1.22], [0.5, 0.48, 1.02], 'field', 'c'],
  [58.75, '@v3_spinoza_eksik', [0.5, 0.42, 1.1], [0.5, 0.36, 1.2], 'clip', 'x'],
  [T(127), 'pencere', [0.5, 0.5, 1.25], [0.5, 0.48, 1.04], 'cold', 'c'],
  [T(132), 'omuz', [0.66, 0.42, 1.55], [0.66, 0.4, 1.75], 'candleL', 'c'],
  [72.5, '@v4_leibniz_senfoni', [0.5, 0.42, 1.18], [0.5, 0.45, 1.0], 'clip', 'L'],
  [T(146), 'spDin', [0.5, 0.3, 1.55], [0.5, 0.28, 1.75], 'candleL', 'c'],
  [T(150), 'lbDin', [0.5, 0.28, 1.7], [0.5, 0.28, 1.5], 'whisper', 'x'],
  [T(156), 'spYakin', [0.66, 0.32, 1.6], [0.66, 0.31, 1.78], 'candleR', 'c'],
  [88.3, 'mumH', [0.5, 0.36, 1.35], [0.5, 0.4, 1.18], 'blowout', 'L'],
  [T(166), 'yazma2', [0.5, 0.6, 1.25], [0.5, 0.45, 1.08], 'motes', 'x'],
  [T(173), 'mercek2', [0.5, 0.5, 1.1], [0.5, 0.42, 1.3], 'worlds', 'c'],
  [97.7, 'split', [0, 0, 0], [0, 0, 0], 'split', 'L'],
  [104.0, 'mercek', [0.5, 0.48, 1.3], [0.5, 0.48, 1.45], 'end', 'x'],
];
const SHOTS = SH.map(s => ({ t0: s[0], k: s[1], a: s[2], b: s[3], fx: s[4], j: s[5] }));
SHOTS.forEach((s, i) => s.t1 = i + 1 < SHOTS.length ? SHOTS[i + 1].t0 : DUR + 0.5);
const XF = 0.4;
const shotAt = t => { let i = SHOTS.findIndex(s => t >= s.t0 && t < s.t1); return i < 0 ? SHOTS.length - 1 : i; };
const CUR = {};  // clip frame images ready for this frame

function drawShot(s, t) {
  const lt = t - s.t0, d = s.t1 - s.t0, e = ease((lt + 0.2) / (d + 0.4));
  let u = lerp(s.a[0], s.b[0], e), v = lerp(s.a[1], s.b[1], e), z = lerp(s.a[2], s.b[2], e), filt = 'none', dx = 0, dy = 0;
  if (s.fx === 'archive') filt = 'sepia(0.45) contrast(1.08) brightness(0.88) saturate(0.85)';
  if (s.fx === 'cold') filt = 'saturate(0.55) brightness(0.85) hue-rotate(-12deg)';
  if (s.fx === 'hayir') { const lh = t - wt(9); if (lh > 0 && lh < 0.5) { const sh = (1 - lh / 0.5) * 22; dx = Math.sin(t * 93) * sh; dy = Math.cos(t * 71) * sh; } }
  if (s.fx === 'drop') { const ld = t - wt(74); if (ld > 0 && ld < 0.45) { const sh = (1 - ld / 0.45) * 18; dx = Math.sin(t * 88) * sh; dy = Math.cos(t * 67) * sh; } }
  if (s.fx === 'split') { drawSplit(t, lt); return; }
  ctx.save(); ctx.translate(dx, dy);
  if (s.k[0] === '@') { const im = CUR[s.k.slice(1)]; if (im) drawImg(im, u, v, z, 0, 0, W, H, 'contrast(1.04) saturate(0.92)'); }
  else if (s.fx === 'float' || s.fx === 'drop') stoneShot(s, t, lt, u, v, z);
  else drawImg(G[s.k], u, v, z, 0, 0, W, H, filt);
  ctx.restore();
  // motion layers per shot
  const f = flick(t);
  if (s.fx === 'hook') hookFx(t);
  if (s.fx === 'archive') { motes(t, 0.5); }
