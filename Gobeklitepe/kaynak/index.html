<html lang="tr"><head><meta charset="utf-8"><title>Göbeklitepe 9x16</title>
<style>

</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="words.js"></script>
<script src="veo.js"></script>
<script>
// Göbeklitepe: "Önce açlık mı, Tanrı mı?"  Canvas engine, frames are pure functions of time.
const W = 1080, H = 1920, FPS = 30, DUR = window.DATA.duration, FRAMES = Math.round(DUR * FPS);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const D = window.DATA, WD = D.words;
// Palette: sun-baked limestone and firelight against a night sky (the film moves from fire to stars).
const GOLD = '#F0B24A', CREAM = '#F4ECDC', EMBER = '#FF8A3D', STONE = '#D9C7A3';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const wt = i => WD[i].s, we = i => WD[i].e;
const LAST = WD.length - 1;
const IDX = (word, from = 0) => { const i = WD.findIndex((x, j) => j >= from && x.w.replace(/[.,?!:;]/g, '') === word); if (i < 0) throw new Error('word not found: ' + word); return i; };
const SENCE = IDX('Sence', 250), CEVAP = IDX('Cevap', SENCE), YOKSA2 = IDX('Yoksa', CEVAP), CTA = IDX('Bunu', CEVAP);

// ---------------- media ----------------
if (new URLSearchParams(location.search).has('eksik')) window.ALLOW_MISSING = true;
const IMG = {
  kitap: 'ai/s01a_kitap_s7.jpg', alev: 'ai/s01b_kitap_alev_s7.jpg', dikilitasAI: 'ai/s02a_dikilitas_s42.jpg',
  koy: 'ai/s03a_koy_s7.jpg', saban: 'ai/s03b_saban_s7.jpg', avcilar: 'ai/s04a_avcilar_s42.jpg', tahil: 'ai/s04b_tahil_s7.jpg',
  oymaF: 'flow/v4/scene-02.jpeg', kaldirmaF: 'flow/v5/scene-01-v2.jpeg',   // Veo made the pillar jump up: the still of the pull instead
  kabartmaF: 'flow/v4/scene-03.jpeg',   // stone strikes stone, no chisel
  ocak: 'ai/s05a_ocak_s7.jpg', kaldirma: 'ai/s05b_kaldirma_s7.jpg', cakmak: 'ai/s05c_cakmak_s7.jpg', mesale: 'ai/s06a_mesaleler_s7.jpg',
  kabartmaAI: 'ai/s07a_kabartma_s7.jpg', gomulu: 'ai/s08a_gomulu_s7.jpg', siluet: 'ai/s09a_siluet_s7.jpg', ates: 'ai/s10a_ates_s7.jpg',
  tasgok: 'ai/s11a_tas_gok_s7.jpg', eller: 'ai/s12a_eller_s7.jpg', karanlik: 'ai/s13a_karanlik_s7.jpg',
  akbaba: 'arsiv/akbaba-tasi.jpg', koltilki: 'arsiv/kol-tilki.jpg', av: 'arsiv/av-sahnesi.jpg',
};
// Flow (Nano Banana, with the real pillars as reference) replaces the stills SDXL drew wrong (no T pillars, wheels, horses)
Object.assign(IMG, { dikilitasAI: 'flow/v3/scene-01.jpeg', kaldirma: 'flow/v3/scene-02.jpeg', gomulu: 'flow/v3/scene-03.jpeg',
  eller: 'flow/v3/scene-04.jpeg', cakmak: 'flow/v3/scene-05.jpeg', saban: 'flow/v3/scene-06.jpeg' });
Object.assign(IMG, window.PICK || {});
// real footage, unpacked to 30 fps JPEG frames: gorseller/klip/<name>/0001.jpg ... (count = frames)
const CLIP = { daire: 300, kazi: 256, dikilitas: 346, kabartma: 570, cati: 480, hava: 435, dikey: 312, ...(window.VEO_CLIPS || {}) };
// Veo key scenes: until a clip is unpacked the shot uses the still it was made from
const VEO_FALLBACK = { v_oyma: 'oymaF', v_kaldirma: 'kaldirmaF', v_avci: 'avcilar', v_mesale: 'mesale', v_kabartma: 'kabartmaF' };
const G = {};
function loadImg(src) { return new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error('missing ' + src)); im.src = '../gorseller/' + src; }); }
const cache = new Map();
async function clipFrame(k, i) {
  const p = `klip/${k}/${String(i).padStart(4, '0')}.jpg`;
  if (cache.has(p)) return cache.get(p);
  const im = await loadImg(p); cache.set(p, im);
  if (cache.size > 30) cache.delete(cache.keys().next().value);
  return im;
}
async function prep() {
  const MISSING = window.ALLOW_MISSING ? [] : null;   // preview only: ?eksik=1 draws a grey card for stills not made yet
  await Promise.all(Object.entries(IMG).map(async ([k, s]) => { try { G[k] = await loadImg(s); } catch (e) { if (!MISSING) throw e; MISSING.push(k); const c = document.createElement('canvas'); c.width = 768; c.height = 1344; const x = c.getContext('2d'); x.fillStyle = '#3a3128'; x.fillRect(0, 0, 768, 1344); x.fillStyle = '#d9c7a3'; x.font = '60px sans-serif'; x.fillText('EKSIK: ' + k, 40, 680); G[k] = c; } }));
  G.grain = [0, 1, 2, 3].map(s => { const c = document.createElement('canvas'); c.width = 540; c.height = 960; const x = c.getContext('2d'); const d = x.createImageData(540, 960); const r = rng(77 + s);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });
  const p = document.createElement('canvas'); p.width = p.height = 128; const px = p.getContext('2d'); const g = px.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(235,215,185,0.5)'); g.addColorStop(0.5, 'rgba(215,190,160,0.16)'); g.addColorStop(1, 'rgba(200,180,150,0)'); px.fillStyle = g; px.fillRect(0, 0, 128, 128); G.puff = p;
}
// cover-crop view (u,v = centre 0..1, z = zoom)
function drawImg(im, u, v, z, rot = 0, filter = 'none') {
  const iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;
  const s = Math.max(W / iw, H / ih) * z;
  ctx.save(); ctx.filter = filter; ctx.translate(W / 2, H / 2); if (rot) ctx.rotate(rot);
  const dw = iw * s, dh = ih * s; const ox = clamp(u * dw - W / 2, 0, dw - W), oy = clamp(v * dh - H / 2, 0, dh - H);
  ctx.drawImage(im, -W / 2 - ox, -H / 2 - oy, dw, dh); ctx.restore(); ctx.filter = 'none';
}

// ---------------- motion layers ----------------
const EMB = (() => { const r = rng(451), a = []; for (let i = 0; i < 150; i++) a.push({ x: r(), p: r(), s: r(), w: r() * 6.28 }); return a; })();
function embers(t, amt, cx = 0.5, spread = 0.9, y0 = 0.95, speed = 1) {
  if (amt <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const e of EMB) { const life = (2.4 + e.s * 2.2) / speed, ph = ((t / life + e.p) % 1);
    const x = (cx + (e.x - 0.5) * spread + Math.sin(t * 1.3 + e.w) * 0.05 * ph) * W, y = (y0 - ph * (0.55 + e.s * 0.5)) * H, r = 2 + e.s * 5;
    ctx.globalAlpha = amt * Math.sin(Math.PI * ph) * (0.55 + 0.45 * Math.sin(t * 11 + e.w * 3));
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3); g.addColorStop(0, 'rgba(255,228,170,1)'); g.addColorStop(0.3, 'rgba(255,140,50,0.85)'); g.addColorStop(1, 'rgba(255,70,10,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r * 3, y - r * 3, r * 6, r * 6); }
  ctx.restore();
}
const flick = t => 0.55 + 0.25 * Math.sin(t * 13.1) + 0.12 * Math.sin(t * 29.7 + 1.3) + 0.08 * Math.sin(t * 7.3 + 2.1);
function fireGlow(t, amt, cx = 0.5, cy = 1.0, rad = 1.1) {   // breathing warm light from a fire below
  ctx.save(); ctx.globalCompositeOperation = 'screen'; const k = amt * flick(t);
  const g = ctx.createRadialGradient(cx * W, cy * H, 0, cx * W, cy * H, rad * H); g.addColorStop(0, `rgba(255,150,60,${0.55 * k})`); g.addColorStop(0.5, `rgba(255,90,30,${0.18 * k})`); g.addColorStop(1, 'rgba(255,80,20,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function torch(t, amt) {    // flickering torchlight: warm wash that breathes, shadows that breathe darker
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = `rgba(${Math.round(150 + 60 * flick(t))},${Math.round(95 + 40 * flick(t + 0.3))},60,${0.35 * amt})`; ctx.fillRect(0, 0, W, H); ctx.restore();
  fireGlow(t, 0.6 * amt, 0.15, 0.35, 0.9);
}
const PUFFS = (() => { const r = rng(100), a = []; for (let i = 0; i < 90; i++) a.push({ x: r(), d: r(), p: r(), s: 0.6 + r() * 1.4, w: r() * 6.28 }); return a; })();
function smoke(t, amt, cx = 0.5, cy = 0.55, spread = 0.5, speed = 0.5) {
  if (amt <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const f of PUFFS) { const life = 3.2 / speed, ph = ((t / life + f.p) % 1);
    const y = (cy - ph * (0.75 + f.d * 0.3)) * H, x = (cx + (f.x - 0.5) * spread * (0.4 + ph * 1.4) + Math.sin(t * 0.9 + f.w) * 0.03 * ph) * W;
    const r = (80 + 260 * ph) * f.s; ctx.globalAlpha = amt * Math.sin(Math.PI * ph) * 0.6; ctx.drawImage(G.puff, x - r, y - r, r * 2, r * 2); }
  ctx.restore();
}
const MOTES = (() => { const r = rng(33), a = []; for (let i = 0; i < 130; i++) a.push({ x: r(), y: r(), s: r(), p: r() * 6.28 }); return a; })();
function motes(t, amt, col = '255,214,150', wind = 0.004) {
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const m of MOTES) { const x = ((m.x + Math.sin(t * 0.2 + m.p) * 0.03 + t * wind * (0.5 + m.s)) % 1 + 1) % 1 * W, y = ((m.y - t * 0.01 * (0.3 + m.s)) % 1 + 1) % 1 * H, r = 1.5 + m.s * 3.5;
    ctx.globalAlpha = amt * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 2 + m.p))); ctx.fillStyle = `rgb(${col})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
const STREAK = (() => { const r = rng(808), a = []; for (let i = 0; i < 70; i++) a.push({ y: r(), p: r(), s: r(), l: r() }); return a; })();
function dustStorm(t, amt) {   // wind-blown dust sweeping across the hill
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.filter = 'blur(14px)';   // soft drifting veils, never hard bars
  for (const d of STREAK) { const sp = 0.18 + d.s * 0.35, x = (((d.p + t * sp) % 1.4) - 0.2) * W, y = (0.35 + d.y * 0.65) * H + Math.sin(t * 2 + d.p * 9) * 18, l = 260 + d.l * 560, h = 30 + d.s * 70;
    const g = ctx.createLinearGradient(x - l, y, x, y); g.addColorStop(0, 'rgba(210,180,140,0)'); g.addColorStop(0.6, `rgba(220,190,150,${0.13 * amt * (0.4 + d.s)})`); g.addColorStop(1, 'rgba(220,190,150,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x - l / 2, y, l / 2, h / 2, 0, 0, 6.283); ctx.fill(); }
  ctx.filter = 'none'; ctx.restore(); motes(t, 0.6 * amt, '225,200,165', 0.03);
}
const ASH = (() => { const r = rng(55), a = []; for (let i = 0; i < 120; i++) a.push({ x: r(), p: r(), s: r(), w: r() * 6.28 }); return a; })();
function ash(t, amt) {
  ctx.save();
  for (const f of ASH) { const ph = ((t * (0.08 + f.s * 0.1) + f.p) % 1), x = (f.x + Math.sin(t * 0.8 + f.w) * 0.03) * W, y = ph * H, r = 2 + f.s * 6;
    ctx.globalAlpha = amt * (0.35 + 0.5 * f.s); ctx.fillStyle = f.s > 0.8 ? 'rgba(255,150,70,1)' : 'rgba(190,185,180,1)';
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * (1 + f.s * 3) + f.w); ctx.fillRect(-r, -r * 0.4, r * 2, r * 0.8); ctx.restore(); }
  ctx.restore();
}
const CHIPS = (() => { const r = rng(96), a = []; for (let i = 0; i < 40; i++) a.push({ a: r(), v: r(), s: r() }); return a; })();
function chips(t, amt, cx = 0.5, cy = 0.55, period = 0.9) {   // stone chips jumping at every flint strike
  const lt = t % period; ctx.save();
  for (const c of CHIPS) { const ang = -Math.PI / 2 + (c.a - 0.5) * 2.4, sp = 500 + c.v * 900, x = cx * W + Math.cos(ang) * sp * lt, y = cy * H + Math.sin(ang) * sp * lt + 1400 * lt * lt;
    ctx.globalAlpha = amt * clamp(1 - lt / period, 0, 1); ctx.fillStyle = c.s > 0.5 ? '#EFE6D2' : '#C9B994'; const r = 2 + c.s * 5; ctx.fillRect(x - r, y - r, r * 2, r * 1.5); }
  ctx.restore(); if (lt < 0.06) { ctx.fillStyle = `rgba(255,240,210,${0.18 * amt * (1 - lt / 0.06)})`; ctx.fillRect(0, 0, W, H); }
}
const LIGHTS = (() => { const r = rng(1848), a = []; for (let i = 0; i < 260; i++) a.push({ x: r(), y: 0.45 + r() * 0.5, on: r(), s: r() }); return a; })();
function cityLights(t, k) {
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const L of LIGHTS) { if (L.on > k) continue; const fl = 0.75 + 0.25 * Math.sin(t * 7 + L.s * 40); const x = L.x * W, y = L.y * H, r = 8 + L.s * 20;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(255,214,140,${0.85 * fl})`); g.addColorStop(1, 'rgba(255,180,90,0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
  ctx.restore();
}
function godRays(t, amt, cx = 0.75, cy = 0.02) {
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.translate(cx * W, cy * H);
  for (let i = 0; i < 7; i++) { const a = 0.35 + i * 0.13 + Math.sin(t * 0.3 + i) * 0.03; const g = ctx.createLinearGradient(0, 0, Math.cos(a + 1.2) * 1800, Math.sin(a + 1.2) * 1800);
    g.addColorStop(0, `rgba(255,205,130,${0.15 * amt})`); g.addColorStop(1, 'rgba(255,205,130,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a + 1.2 - 0.04) * 2200, Math.sin(a + 1.2 - 0.04) * 2200); ctx.lineTo(Math.cos(a + 1.2 + 0.04) * 2200, Math.sin(a + 1.2 + 0.04) * 2200); ctx.fill(); }
  ctx.restore();
}
// 3D sky: a star sphere with a Milky Way band, turning slowly, projected through a pinhole camera
const STARS = (() => { const r = rng(9600), a = [];
  for (let i = 0; i < 1500; i++) { const th = r() * 6.283, ph = Math.acos(2 * r() - 1); a.push({ x: Math.sin(ph) * Math.cos(th), y: Math.cos(ph), z: Math.sin(ph) * Math.sin(th), m: r(), b: 0 }); }
  for (let i = 0; i < 2600; i++) { const th = r() * 6.283, ph = Math.PI / 2 + (r() + r() + r() - 1.5) * 0.16; a.push({ x: Math.sin(ph) * Math.cos(th), y: Math.cos(ph), z: Math.sin(ph) * Math.sin(th), m: r() * 0.7, b: 1 }); }
  return a; })();
function stars(t, amt, pitch = 0.35, horizon = 0.62, yaw0 = 0) {
  const yaw = yaw0 + t * 0.012, cy = Math.cos(yaw), sy = Math.sin(yaw), roll = 0.75, cr = Math.cos(roll), sr = Math.sin(roll), cp = Math.cos(pitch), sp = Math.sin(pitch), f = 820;
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const s of STARS) {
    let x = s.x * cy - s.z * sy, z = s.x * sy + s.z * cy, y = s.y;
    const x1 = x * cr - y * sr, y1 = x * sr + y * cr; const y2 = y1 * cp - z * sp, z2 = y1 * sp + z * cp;
    if (z2 <= 0.08) continue; const px = W / 2 + x1 / z2 * f, py = H * 0.4 + y2 / z2 * f;
    if (px < -4 || px > W + 4 || py < -4 || py > H * horizon) continue;
    const fade = clamp((H * horizon - py) / 160, 0, 1), tw = 0.65 + 0.35 * Math.sin(t * (2 + s.m * 3) + s.m * 50), r = (s.b ? 1.1 : 1.6) + s.m * 2.2;
    ctx.globalAlpha = amt * fade * tw * (0.3 + 0.7 * s.m); ctx.fillStyle = s.b ? '#D6DEFF' : '#FFF4E2'; ctx.fillRect(px - r / 2, py - r / 2, r, r);
  }
  ctx.restore();

// ---------------- text ----------------
function cardText(lines, lt, { y = 520, size = 130, color = CREAM, sub = null, subColor = GOLD, font = 'Anton', fade = 0.3, band = 0.42, slam = false } = {}) {
  if (lt < 0) return; const a = fade ? ease(lt / fade) : 1; const sc = slam ? lerp(1.6, 1, ease(lt / 0.14)) : 1;
  if (band) { const g = ctx.createLinearGradient(0, y - size * 1.9, 0, y + size * (lines.length + 0.6)); g.addColorStop(0, 'rgba(6,5,4,0)'); g.addColorStop(0.3, `rgba(6,5,4,${band * a})`); g.addColorStop(0.7, `rgba(6,5,4,${band * a})`); g.addColorStop(1, 'rgba(6,5,4,0)'); ctx.fillStyle = g; ctx.fillRect(0, y - size * 1.9, W, size * (lines.length + 2.5)); }
  ctx.save(); ctx.globalAlpha = slam ? Math.min(1, ease(lt / 0.1)) : a; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.translate(W / 2, y); ctx.scale(sc, sc);
  lines.forEach((s, i) => { let sz = size; ctx.font = `${font === 'Anton' ? '' : '900 '}${sz}px ${font}`; const mw = ctx.measureText(s).width; if (mw > 960) { sz = Math.floor(sz * 960 / mw); ctx.font = `${font === 'Anton' ? '' : '900 '}${sz}px ${font}`; }
    const yy = i * size * 1.08 + (fade && !slam ? (1 - a) * 20 : 0); ctx.lineWidth = sz * 0.1; ctx.strokeStyle = 'rgba(8,6,4,0.92)'; ctx.strokeText(s, 0, yy);
    ctx.fillStyle = Array.isArray(color) ? color[i] : color; ctx.shadowColor = 'rgba(240,160,70,0.45)'; ctx.shadowBlur = 34; ctx.fillText(s, 0, yy); ctx.shadowBlur = 0; });
  if (sub) { ctx.font = '700 42px Cinzel'; ctx.fillStyle = subColor; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(8,6,4,0.85)'; ctx.strokeText(sub, 0, -size * 1.0); ctx.fillText(sub, 0, -size * 1.0); ctx.fillRect(-70, -size * 1.0 + 22, 140, 3); }
  ctx.restore();
}
const at = (t, i, lead = 0.1) => t - wt(i) + lead;
function stamp(word, lt, y, color = CREAM, size = 150) {   // "TARLA YOK" with a red strike that slams in
  if (lt < 0) return; const k = ease(lt / 0.12), sc = lerp(1.5, 1, k);
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(sc, sc); ctx.globalAlpha = Math.min(1, lt / 0.08); ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  ctx.font = `${size}px Anton`; ctx.lineWidth = size * 0.107; ctx.strokeStyle = 'rgba(8,6,4,0.92)'; ctx.strokeText(word, -70, 0); ctx.fillStyle = color; ctx.fillText(word, -70, 0);
  const ww = ctx.measureText(word).width; ctx.font = `${Math.round(size * 0.73)}px Anton`; ctx.strokeText('YOK', ww / 2 + 40, -6); ctx.fillStyle = '#E2533F'; ctx.fillText('YOK', ww / 2 + 40, -6);
  const sk = ease((lt - 0.15) / 0.18); if (sk > 0) { ctx.strokeStyle = '#E2533F'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(-70 - ww / 2 - 10, -50); ctx.lineTo(-70 - ww / 2 - 10 + (ww + 20) * sk, -50); ctx.stroke(); }
  ctx.restore();
}
function timeline(t, lt) {   // vertical time axis: Göbeklitepe at the top, the rest far below
  const a = ease(lt / 0.4); ctx.fillStyle = `rgba(5,4,3,${0.58 * a})`; ctx.fillRect(0, 0, W, H);
