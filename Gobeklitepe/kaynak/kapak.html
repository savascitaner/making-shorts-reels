<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Göbeklitepe kapak</title>
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Cinzel;font-weight:700;src:url(fonts/cinzel-latin-700.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cinzel;font-weight:700;src:url(fonts/cinzel-latin-ext-700.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF}
@font-face{font-family:Alegreya Sans;font-weight:800;src:url(fonts/alegreya-sans-latin-800.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Alegreya Sans;font-weight:800;src:url(fonts/alegreya-sans-latin-ext-800.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF}
html,body{margin:0;background:#000}canvas{display:block;width:360px;height:640px}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const GOLD = '#F0B24A', CREAM = '#F4ECDC';
const BG = new URLSearchParams(location.search).get('bg') || 'flow/scene-02.jpeg';
function load(src) { return new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error(src)); im.src = '../gorseller/' + src; }); }
function cover(im, u, v, z) { const s = Math.max(W / im.width, H / im.height) * z, dw = im.width * s, dh = im.height * s; ctx.drawImage(im, -Math.max(0, Math.min(dw - W, u * dw - W / 2)), -Math.max(0, Math.min(dh - H, v * dh - H / 2)), dw, dh); }
function txt(s, x, y, font, fill, lw, align = 'center', glow = 0) { ctx.font = font;
  const mw = ctx.measureText(s).width; if (mw > 980) { const px = +font.match(/(\d+)px/)[1]; font = font.replace(/\d+px/, Math.floor(px * 980 / mw) + 'px'); lw = lw * 980 / mw; ctx.font = font; } ctx.textAlign = align; ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = 'rgba(8,6,4,0.95)'; ctx.strokeText(s, x, y); if (glow) { ctx.shadowColor = 'rgba(255,150,50,0.75)'; ctx.shadowBlur = glow; } ctx.fillStyle = fill; ctx.fillText(s, x, y); ctx.shadowBlur = 0; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function yt(x, y, s) { ctx.fillStyle = '#FF0033'; rr(x - s * 0.71, y - s / 2, s * 1.42, s, s * 0.28); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - s * 0.17, y - s * 0.24); ctx.lineTo(x + s * 0.27, y); ctx.lineTo(x - s * 0.17, y + s * 0.24); ctx.fill(); }
function ig(x, y, s) { const g = ctx.createLinearGradient(x - s / 2, y + s / 2, x + s / 2, y - s / 2); g.addColorStop(0, '#F9CE34'); g.addColorStop(0.5, '#EE2A7B'); g.addColorStop(1, '#6228D7'); ctx.strokeStyle = g; ctx.lineWidth = s * 0.11; rr(x - s / 2, y - s / 2, s, s, s * 0.28); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y, s * 0.22, 0, 6.283); ctx.stroke(); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x + s * 0.26, y - s * 0.26, s * 0.06, 0, 6.283); ctx.fill(); }
function web(x, y, s) { ctx.strokeStyle = GOLD; ctx.lineWidth = s * 0.08; ctx.beginPath(); ctx.arc(x, y, s / 2, 0, 6.283); ctx.stroke(); ctx.beginPath(); ctx.ellipse(x, y, s * 0.22, s / 2, 0, 0, 6.283); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - s / 2, y); ctx.lineTo(x + s / 2, y); ctx.stroke(); }
async function draw() {
  const im = await load(BG); cover(im, 0.5, 0.55, 1.0);
  // grade: warm fire at the bottom, dark top and bottom for type
  let g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(5,4,3,0.7)'); g.addColorStop(0.3, 'rgba(5,4,3,0.35)'); g.addColorStop(0.48, 'rgba(5,4,3,0)'); g.addColorStop(0.68, 'rgba(5,4,3,0)'); g.addColorStop(0.84, 'rgba(5,4,3,0.6)'); g.addColorStop(1, 'rgba(5,4,3,0.85)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.8); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.5)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // front cover: the question only, inside the 4:5 grid-safe band (y 285..1635); no addresses (they live on the end card)
  txt('11.500 YIL ÖNCE', W / 2, 380, '700 54px Cinzel', GOLD, 8);
  txt('ÖNCE AÇLIK MI,', W / 2, 560, '168px Anton', CREAM, 18);
  txt('TANRI MI?', W / 2, 840, '300px Anton', GOLD, 26, 'center', 70);
  txt('GÖBEKLİTEPE', W / 2, 1520, '200px Anton', CREAM, 20, 'center', 34);
  ctx.fillStyle = GOLD; ctx.fillRect(W / 2 - 140, 1562, 280, 6);
  txt('TARİHİ TERSİNE ÇEVİREN TEPE', W / 2, 1630, '700 46px Cinzel', GOLD, 7);
}
window.READY = (async () => { await Promise.all(['150px Anton', '700 40px Cinzel', '800 40px "Alegreya Sans"'].map(f => document.fonts.load(f, 'ŞİĞÜÖÇışğüöç'))); await draw(); return { frames: 1, fps: 1, width: W, height: H, renderer: 'canvas' }; })();
window.captureFrame = (f, type = 'image/png', q = 0.95) => cv.toDataURL(type, q);
</script></body></html>
