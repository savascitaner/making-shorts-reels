const W = WIDE ? 1920 : 1080, H = WIDE ? 1080 : 1920, FPS = 30;
const cv = document.getElementById('c'), ctx = cv.getContext('2d'); cv.width = W; cv.height = H;

const AMBER = '#F0B04A', CREAM = '#F4ECDD', ICE = '#8FB8E8', INK = '#07080C';

const ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };

function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function drawView(k, u, v, z, filter = 'none', alpha = 1) {

// ---------- atmosfer katmanları ----------
const MOTES = (() => { const r = rng(1875), a = []; for (let i = 0; i < 140; i++) a.push({ x: r(), y: r(), s: r(), p: r() * 6.28 }); return a; })();
function motes(t, amt, col = '255,214,150') {
  if (amt <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const m of MOTES) { const x = (((m.x + Math.sin(t * 0.21 + m.p) * 0.025 + t * 0.003 * (m.s - 0.5)) % 1) + 1) % 1 * W, y = (((m.y - t * 0.008 * (0.3 + m.s)) % 1) + 1) % 1 * H, r = (1.2 + m.s * 3.2) * (WIDE ? 0.8 : 1);
    ctx.globalAlpha = amt * (0.25 + 0.6 * (0.5 + 0.5 * Math.sin(t * 1.7 + m.p))); ctx.fillStyle = `rgb(${col})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
const DROPS = (() => { const r = rng(9), a = []; for (let i = 0; i < 180; i++) a.push({ x: r(), y: r(), s: r() }); return a; })();
function rain(t, amt) { ctx.save(); ctx.strokeStyle = 'rgba(190,210,255,0.4)'; ctx.lineWidth = 2;
  for (const d of DROPS) { const sp = 1100 + d.s * 900, y = ((d.y * H + t * sp) % (H + 200)) - 100, x = d.x * W - (y / H) * 70, l = 30 + d.s * 70;
    ctx.globalAlpha = amt * (0.25 + d.s * 0.6); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 9, y + l); ctx.stroke(); } ctx.restore(); }
function flare(t, amt, x, y, col = '255,230,190') {   // far ışığı
  if (amt <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'screen'; const R = Math.min(W, H) * (0.25 + 0.6 * amt);
  const g = ctx.createRadialGradient(x, y, 0, x, y, R); g.addColorStop(0, `rgba(${col},${0.9 * amt})`); g.addColorStop(0.2, `rgba(${col},${0.35 * amt})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.fillStyle = `rgba(${col},${0.25 * amt})`; ctx.fillRect(0, y - 2, W, 4); ctx.restore();
}

  const g = ctx.createRadialGradient(x * W, y * H, 0, x * W, y * H, Math.max(W, H) * 0.7); g.addColorStop(0, `rgba(255,190,110,${0.55 * amt * f})`); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); }

function txt(s, x, y, { size = 100, font = 'Anton', color = CREAM, align = 'center', a = 1, glow = 'rgba(240,176,74,0.45)', stroke = 0.08, weight = '' } = {}) {

  ctx.fillStyle = color; if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 30 * S; } ctx.fillText(s, x, y); ctx.restore(); return size;
}
function band(y0, y1, a) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, 'rgba(4,5,9,0)'); g.addColorStop(0.3, `rgba(4,5,9,${0.55 * a})`); g.addColorStop(0.7, `rgba(4,5,9,${0.55 * a})`); g.addColorStop(1, 'rgba(4,5,9,0)'); ctx.fillStyle = g; ctx.fillRect(0, y0, W, y1 - y0); }

}
