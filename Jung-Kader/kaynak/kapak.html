<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Kapak</title>
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Cinzel;font-weight:700;src:url(fonts/cinzel-latin-700.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cinzel;font-weight:700;src:url(fonts/cinzel-latin-ext-700.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF}
html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh}
</style></head><body><canvas id="c"></canvas>
<script>
// Kapak: kanca sorusu + konu adı, büyük; adres YOK. Reels 1080x1920 (yazı 4:5 güvenli alanda), YouTube 1920x1080.
const Q = new URLSearchParams(location.search), WIDE = Q.get('f') === '16x9';
const W = WIDE ? 1920 : 1080, H = WIDE ? 1080 : 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d'); cv.width = W; cv.height = H;
const AMBER = '#F0B04A', CREAM = '#F4ECDD';
function load(src) { return new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; }); }
function cover(im, u, v, z) { const s = Math.max(W / im.width, H / im.height) * z, dw = im.width * s, dh = im.height * s; ctx.drawImage(im, -Math.max(0, Math.min(dw - W, u * dw - W / 2)), -Math.max(0, Math.min(dh - H, v * dh - H / 2)), dw, dh); }
function t(s, x, y, size, col, glow = 'rgba(240,176,74,0.55)', align = 'center') {
  ctx.save(); ctx.textAlign = align; ctx.font = `${size}px Anton`; const mw = ctx.measureText(s).width, lim = WIDE ? W * 0.5 : W * 0.92; if (mw > lim) { size *= lim / mw; ctx.font = `${size}px Anton`; }
  ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.08; ctx.strokeStyle = 'rgba(5,5,10,0.92)'; ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.shadowColor = glow; ctx.shadowBlur = 40; ctx.fillText(s, x, y); ctx.restore(); }
function thread(x0, y0, x1, y1) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; for (const [w, a, b] of [[20, 0.12, 30], [8, 0.3, 12], [3, 1, 4]]) { ctx.globalAlpha = a; ctx.strokeStyle = AMBER; ctx.lineWidth = w; ctx.shadowColor = AMBER; ctx.shadowBlur = b; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo((x0 + x1) / 2, y0 - 30, x1, y1); ctx.stroke(); } ctx.restore(); }
window.READY = (async () => {
  await document.fonts.load('300px Anton', 'ŞİĞÜÖÇ?'); await document.fonts.load('700 40px Cinzel', 'ŞİĞÜÖÇ');
  const im = await load(`../gorseller/ai/${WIDE ? 'w' : 'r'}/A0a-analiz-odasi.jpg`), jung = await load('../gorseller/arsiv/jung.jpg');
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);
  if (WIDE) {
    if (im) cover(im, 0.62, 0.45, 1.0);
    const g = ctx.createLinearGradient(0, 0, W * 0.62, 0); g.addColorStop(0, 'rgba(4,5,9,0.95)'); g.addColorStop(0.75, 'rgba(4,5,9,0.6)'); g.addColorStop(1, 'rgba(4,5,9,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (jung) { ctx.save(); ctx.globalAlpha = 0.9; ctx.filter = 'grayscale(1) contrast(1.2)'; const h = 330, w = h * jung.width / jung.height; ctx.translate(120 + w / 2, 150 + h / 2); ctx.rotate(-0.04); ctx.fillStyle = '#E9E0CC'; ctx.fillRect(-w / 2 - 10, -h / 2 - 10, w + 20, h + 20); ctx.drawImage(jung, -w / 2, -h / 2, w, h); ctx.restore(); }
    t('JUNG', 110, 680, 260, CREAM, undefined, 'left'); t('HAKLI MIYDI?', 110, 860, 175, AMBER, 'rgba(240,176,74,0.7)', 'left'); thread(100, 900, 900, 890);
    ctx.save(); ctx.font = '700 46px Cinzel'; ctx.fillStyle = CREAM; ctx.shadowColor = '#000'; ctx.shadowBlur = 12; ctx.fillText('BİLİNÇDIŞI · KADER · İNSANIN DOĞASI', 112, 975); ctx.restore();
  } else {
    if (im) cover(im, 0.5, 0.42, 1.0);
    const g = ctx.createLinearGradient(0, 950, 0, H); g.addColorStop(0, 'rgba(4,5,9,0)'); g.addColorStop(0.3, 'rgba(4,5,9,0.75)'); g.addColorStop(1, 'rgba(4,5,9,0.95)'); ctx.fillStyle = g; ctx.fillRect(0, 950, W, H - 950);
    // 4:5 güvenli alan: y 285..1635 — yazı alt bölümde, yüz açık
    t('JUNG', W / 2, 1290, 270, CREAM); t('HAKLI MIYDI?', W / 2, 1470, 180, AMBER, 'rgba(240,176,74,0.7)'); thread(90, 1510, W - 90, 1500);
    ctx.save(); ctx.font = '700 46px Cinzel'; ctx.textAlign = 'center'; ctx.fillStyle = CREAM; ctx.shadowColor = '#000'; ctx.shadowBlur = 12; ctx.fillText('BİLİNÇDIŞI MI, KADER Mİ?', W / 2, 1590); ctx.restore();
  }
  return { frames: 1, fps: 30, width: W, height: H, renderer: 'canvas' };
})();
window.captureFrame = (f, type = 'image/png', q = 0.95) => cv.toDataURL(type, q);
</script></body></html>
