<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Yunus Tapduk 9x16</title>
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Cinzel;font-weight:900;src:url(fonts/cinzel-latin-900.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cinzel;font-weight:900;src:url(fonts/cinzel-latin-ext-900.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF}
@font-face{font-family:Cinzel;font-weight:700;src:url(fonts/cinzel-latin-700.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}

@font-face{font-family:Alegreya Sans;font-weight:800;src:url(fonts/alegreya-sans-latin-ext-800.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF}

</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="words.js"></script>
<script>
const W = 1080, H = 1920, FPS = 30, DUR = window.DATA.duration, FRAMES = Math.round(DUR * FPS);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const D = window.DATA, WD = D.words;
const GOLD = '#F2B544', CREAM = '#F6EEDC', EMBER = '#FF9B54';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const wt = i => WD[i].s, we = i => WD[i].e;
const BOOM = wt(13) - 0.04;          // kanca B: "Hâlâ çiğsin!" vuruşu

// ---------------- clips (Veo) + stills ----------------
const CL = {
  v1: ['v1', 'flow/t1.jpg'], v2: ['v2', 'flow/y1.jpg'], v3: ['v3', 'flow/t1.jpg'], v4: ['v4', 'flow/y2.jpg'], v5: ['v5', 'flow/t2.jpg'], v5b: ['v5', 'flow/t2.jpg'],
  v6: ['v6', 'flow/t3.jpg'], v7: ['v7', 'flow/y3.jpg'],
  s07: ['x', 'flow/s07.jpg'], s08: ['x', 'flow/s08.jpg'], s09: ['x', 'flow/s09.jpg'], s10: ['x', 'flow/s10.jpg'], s11: ['x', 'flow/s11.jpg'], s12: ['x', 'flow/s12.jpg'], s13: ['x', 'flow/s13.jpg'],
  avlu: ['x', 'ai/a01_avlu_s7.jpg'], avlu2: ['x', 'ai/a01_avlu_s42.jpg'], kapi: ['x', 'ai/a02_kapi_s7.jpg'], duz: ['x', 'ai/a03_duz_odun_s7.jpg'], halka: ['x', 'ai/a04_halka_s7.jpg'],
  kapikap: ['x', 'ai/a05_kapi_kapanir_s7.jpg'], dag: ['x', 'ai/a06_dag_patika_s7.jpg'], dag2: ['x', 'ai/a06_dag_patika_s42.jpg'], kar: ['x', 'ai/a07_kar_s7.jpg'], yagmur: ['x', 'ai/a08_yagmur_s7.jpg'],
  agac: ['x', 'ai/a09_ciplak_agac_s7.jpg'], dal: ['x', 'ai/a10_egri_dal_s42.jpg'], dal2: ['x', 'ai/a10_egri_dal_s42.jpg'], egridemet: ['x', 'ai/a11_egri_odun_demeti_s7.jpg'],
  esik: ['x', 'ai/a12_esik_safak_s7.jpg'], esik2: ['x', 'ai/a12_esik_safak_s42.jpg'], isik: ['x', 'ai/a13_isik_ici_s7.jpg'], yanyana: ['x', 'ai/a14_dal_odun_yanyana_s7.jpg'], yanyana2: ['x', 'ai/a14_dal_odun_yanyana_s42.jpg'],
  mevsim: ['x', 'ai/a15_mevsim_s7.jpg'], ates: ['x', 'ai/a16_ates_s7.jpg'],
};
const ALT = { s07: 'flow/y3.jpg', s08: 'ai/a06_dag_patika_s42.jpg', s09: 'ai/a10_egri_dal_s42.jpg', s10: 'ai/a11_egri_odun_demeti_s42.jpg', s11: 'flow/t3.jpg', s12: 'ai/a13_isik_ici_s7.jpg', s13: 'ai/a05_kapi_kapanir_s7.jpg' };
// speaking clips: Veo speech span (klip/<dir>/off.txt) is mapped onto the line's words
const SYNC = { v1: [19, 26], v2: [27, 30], v3: [31, 40], v4: [41, 55], v5: [56, 72], v5b: [13, 18], v6: [87, 91], v7: [92, 104] };
const OFFFILE = { v5b: 'offb.txt' };
const OFF = {};
const CLIP_FPS = 24, BASE = '../gorseller/';
const CLN = {}, G = {}, CACHE = new Map(), HAS = {};
const FLICK = new Set(['v1', 'v3', 'v4', 'v5', 'v5b', 'halka', 'ates', 'duz']);
function loadImg(src) { return new Promise(ok => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = src; }); }
async function getImg(src) { if (CACHE.has(src)) { const v = CACHE.get(src); CACHE.delete(src); CACHE.set(src, v); return v; }
  const im = await loadImg(src); CACHE.set(src, im); if (CACHE.size > 300) CACHE.delete(CACHE.keys().next().value); return im; }
async function prep() {
  for (const [k, [dir, still]] of Object.entries(CL)) { G[k] = await loadImg(BASE + still); if (!G[k] && ALT[k]) G[k] = await loadImg(BASE + ALT[k]);
    const n = dir === 'x' ? null : await fetch(BASE + 'klip/' + dir + '/done').then(r => r.ok ? fetch(BASE + 'klip/' + dir + '/n.txt').then(r2 => r2.ok ? r2.text() : '192') : null).catch(() => null);
    HAS[k] = !!n; if (n) CLN[k] = parseInt(n) || 192;
    if (n && k in SYNC) OFF[k] = await fetch(BASE + 'klip/' + dir + '/' + (OFFFILE[k] || 'off.txt')).then(r => r.ok ? r.text() : '0.6 6.5').then(x => x.trim().split(/\s+/).map(parseFloat)).catch(() => [0.6, 6.5]); }
  G.grain = [0, 1, 2, 3].map(s => { const c = document.createElement('canvas'); c.width = 540; c.height = 960; const x = c.getContext('2d'); const d = x.createImageData(540, 960); const r = rng(77 + s);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });
}
function clipIdx(lt, d, n) { const r = clamp((n / CLIP_FPS) / Math.max(d, 0.01), 0.55, 1); let i = Math.floor(lt * CLIP_FPS * r); const P = 2 * (n - 1); i = ((i % P) + P) % P; return i < n ? i : P - i; }
function frameSrcK(k, s, t) { const [dir] = CL[k]; if (!HAS[k]) return null; const lt = Math.max(0, t - s.t0); const n = CLN[k];
  if (k in SYNC) { const [w0, w1] = SYNC[k], a = wt(w0), b = we(w1), [o0, o1] = OFF[k]; const r = (o1 - o0) / Math.max(0.3, b - a);
    const ct = t < a ? o0 - (a - t) : t > b ? o1 + (t - b) : o0 + (t - a) * r; const i = clamp(Math.round(ct * CLIP_FPS), 0, n - 1); return BASE + 'klip/' + dir + '/' + String(i).padStart(3, '0') + '.jpg'; }
  return BASE + 'klip/' + dir + '/' + String(clipIdx(lt, s.t1 - s.t0, n)).padStart(3, '0') + '.jpg'; }
function drawImg(im, u, v, z, filter = 'none') {
  if (!im) return; const iw = im.width, ih = im.height, s = Math.max(W / iw, H / ih) * z;
  ctx.save(); ctx.filter = filter; const dw = iw * s, dh = ih * s; const ox = clamp(u * dw - W / 2, 0, dw - W), oy = clamp(v * dh - H / 2, 0, dh - H);
  ctx.drawImage(im, -ox, -oy, dw, dh); ctx.restore(); ctx.filter = 'none';
}

// ---------------- motion layers ----------------
const DROPS = (() => { const r = rng(9), a = []; for (let i = 0; i < 180; i++) a.push({ x: r(), y: r(), s: r() }); return a; })();
function rain(t, amt) {
  ctx.save(); ctx.strokeStyle = 'rgba(200,215,255,0.35)'; ctx.lineWidth = 2;
  for (const d of DROPS) { const sp = 1100 + d.s * 900, y = ((d.y * H + t * sp) % (H + 200)) - 100, x = d.x * W - (y / H) * 80, l = 30 + d.s * 70;
    ctx.globalAlpha = amt * (0.3 + d.s * 0.6); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 10, y + l); ctx.stroke(); }
  ctx.restore();
}
const FLAKES = (() => { const r = rng(19), a = []; for (let i = 0; i < 140; i++) a.push({ x: r(), y: r(), s: r(), p: r() * 6.28 }); return a; })();
function snow(t, amt) {
  ctx.save(); ctx.fillStyle = '#eef3ff';
  for (const f of FLAKES) { const y = ((f.y * H + t * (60 + f.s * 120)) % (H + 40)) - 20, x = f.x * W + Math.sin(t * 0.8 + f.p) * 30;
    ctx.globalAlpha = amt * (0.35 + 0.6 * f.s); ctx.beginPath(); ctx.arc(x, y, 2 + f.s * 4, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
const MOTES = (() => { const r = rng(33), a = []; for (let i = 0; i < 120; i++) a.push({ x: r(), y: r(), s: r(), p: r() * 6.28 }); return a; })();
function motes(t, amt) {
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const m of MOTES) { const x = ((m.x + Math.sin(t * 0.2 + m.p) * 0.03 + t * 0.004 * (m.s - 0.5)) % 1 + 1) % 1 * W, y = ((m.y - t * 0.01 * (0.3 + m.s)) % 1 + 1) % 1 * H, r = 1.5 + m.s * 3.5;
    ctx.globalAlpha = amt * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 2 + m.p))); ctx.fillStyle = '#FFD58A'; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
function godRays(t, amt, cx = 0.5, cy = 0.0) {
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.translate(cx * W, cy * H);
  for (let i = 0; i < 7; i++) { const a = 0.35 + i * 0.13 + Math.sin(t * 0.3 + i) * 0.03; const g = ctx.createLinearGradient(0, 0, Math.cos(a + 1.2) * 1800, Math.sin(a + 1.2) * 1800);
    g.addColorStop(0, `rgba(255,210,130,${0.16 * amt})`); g.addColorStop(1, 'rgba(255,210,130,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a + 1.2 - 0.04) * 2200, Math.sin(a + 1.2 - 0.04) * 2200); ctx.lineTo(Math.cos(a + 1.2 + 0.04) * 2200, Math.sin(a + 1.2 + 0.04) * 2200); ctx.fill(); }
  ctx.restore();
}
function mist(t, amt) {
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 4; i++) { const y = H * (0.55 + i * 0.12), x = ((t * 18 * (i + 1)) % (W * 2)) - W * 0.5;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 700); g.addColorStop(0, `rgba(200,210,230,${0.12 * amt})`); g.addColorStop(1, 'rgba(200,210,230,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

// ---------------- text cards ----------------
function cardText(lines, lt, { y = 820, size = 120, color = CREAM, sub = null, subColor = GOLD, font = 'Anton', fade = 0.35, band = 0.45 } = {}) {
  const a = fade ? ease(lt / fade) : 1; if (a <= 0) return;
  if (band) { const g = ctx.createLinearGradient(0, y - size * 1.9, 0, y + size * (lines.length + 0.6)); g.addColorStop(0, 'rgba(5,6,18,0)'); g.addColorStop(0.3, `rgba(5,6,18,${band * a})`); g.addColorStop(0.7, `rgba(5,6,18,${band * a})`); g.addColorStop(1, 'rgba(5,6,18,0)'); ctx.fillStyle = g; ctx.fillRect(0, y - size * 1.9, W, size * (lines.length + 2.5)); }
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  lines.forEach((s, i) => { let sz = size; ctx.font = `${font === 'Anton' ? '' : '900 '}${sz}px ${font}`; const mw = ctx.measureText(s).width; if (mw > 980) { sz = Math.floor(sz * 980 / mw); ctx.font = `${font === 'Anton' ? '' : '900 '}${sz}px ${font}`; }
    const yy = y + i * size * 1.08 + (fade ? (1 - a) * 20 : 0); ctx.lineWidth = sz * 0.09; ctx.strokeStyle = 'rgba(6,6,16,0.9)'; ctx.strokeText(s, W / 2, yy);
    ctx.fillStyle = Array.isArray(color) ? color[i] : color; ctx.shadowColor = 'rgba(242,181,68,0.5)'; ctx.shadowBlur = 34; ctx.fillText(s, W / 2, yy); ctx.shadowBlur = 0; });
  if (sub) { ctx.font = '700 42px Cinzel'; ctx.fillStyle = subColor; ctx.fillText(sub, W / 2, y - size * 1.0); ctx.fillRect(W / 2 - 70, y - size * 1.0 + 22, 140, 3); }
  ctx.restore();
}

// ---------------- shot list ----------------
// [start (word index, or 'T<sec>'), clip key, from[u,v,z], to[u,v,z], fx, card]
const SH = [
  [0, 's07', [0.56, 0.22, 2.0], [0.56, 0.22, 1.75], 'dark'],
  [13, 'v5b', [0.5, 0.42, 1.0], [0.5, 0.42, 1.06], 'boom'],
  ['T9.15', 'avlu', [0.5, 0.5, 1.0], [0.5, 0.5, 1.14], 'motes', 'once'],
  ['T11.4', 'duz', [0.5, 0.5, 1.14], [0.5, 0.5, 1.0], 'motes'],
  [19, 'v1', [0.52, 0.47, 1.45], [0.52, 0.47, 1.55], 'none', 'tapduk'],
  [27, 'v2', [0.5, 0.45, 1.0], [0.5, 0.45, 1.05], 'none', 'yunus'],
  [31, 'v3', [0.52, 0.45, 1.75], [0.52, 0.45, 1.9], 'none'],
  [41, 'v4', [0.5, 0.45, 1.0], [0.5, 0.45, 1.05], 'none'],
  [56, 'v5', [0.5, 0.42, 1.0], [0.5, 0.4, 1.1], 'none', 'cig'],
  ['T39.5', 's13', [0.5, 0.5, 1.0], [0.5, 0.5, 1.1], 'cold'],
  ['T42.3', 'kapikap', [0.5, 0.5, 1.1], [0.5, 0.5, 1.0], 'cold'],
  ['T44.6', 'dag', [0.5, 0.5, 1.0], [0.6, 0.5, 1.15], 'mistc'],
  ['T46.8', 's08', [0.5, 0.45, 1.0], [0.5, 0.45, 1.1], 'rain'],
  ['T48.9', 'kar', [0.5, 0.5, 1.12], [0.5, 0.5, 1.0], 'snow'],
  [73, 's09', [0.5, 0.42, 1.0], [0.5, 0.4, 1.12], 'coldrain'],
  [77, 'dal', [0.5, 0.5, 1.0], [0.5, 0.5, 1.18], 'cold'],
  [79, 'agac', [0.5, 0.5, 1.12], [0.5, 0.5, 1.0], 'mistc'],
  ['T59.3', 'mevsim', [0.4, 0.5, 1.0], [0.6, 0.5, 1.12], 'none', 'yillar'],
  ['T62.2', 's10', [0.5, 0.45, 1.0], [0.5, 0.45, 1.1], 'mist'],
  ['T65.6', 'egridemet', [0.5, 0.5, 1.0], [0.5, 0.5, 1.14], 'rays'],
  ['T68.6', 'esik', [0.5, 0.5, 1.14], [0.5, 0.5, 1.0], 'rays'],
  [87, 'v6', [0.5, 0.42, 1.0], [0.5, 0.42, 1.05], 'warm'],
  [92, 'v7', [0.55, 0.25, 1.5], [0.55, 0.24, 1.7], 'warm'],
  ['T85.2', 'halka', [0.5, 0.5, 1.0], [0.5, 0.5, 1.12], 'rays'],
  [105, 'yanyana', [0.5, 0.5, 1.0], [0.5, 0.5, 1.12], 'none', 'egri'],
  ['T93.7', 'isik', [0.5, 0.5, 1.0], [0.5, 0.45, 1.12], 'rumi', 'rumi'],
  [111, 'ates', [0.5, 0.5, 1.0], [0.5, 0.5, 1.12], 'none', 'yorum'],
  [-2, 'esik2', [0.5, 0.5, 1.0], [0.5, 0.5, 1.05], 'end', 'end'],
];
const END_T = 103.4;
const st0 = x => typeof x === 'string' ? parseFloat(x.slice(1)) : wt(x) - 0.12;
const SHOTS = SH.map((s, i) => ({ t0: i === 0 ? 0 : s[0] === -2 ? END_T : st0(s[0]), k: s[1], a: s[2], b: s[3], fx: s[4], card: s[5] }));
SHOTS.forEach((s, i) => s.t1 = i + 1 < SHOTS.length ? SHOTS[i + 1].t0 : DUR + 0.5);
function drawShot(s, t, im) {
  const lt = t - s.t0, d = s.t1 - s.t0, e = ease((lt + 0.3) / (d + 0.6));
  let u = lerp(s.a[0], s.b[0], e), v = lerp(s.a[1], s.b[1], e), z = lerp(s.a[2], s.b[2], e), filt = 'none';
  if (s.fx === 'dark') filt = `brightness(${lerp(0.45, 0.85, ease(lt / 4))}) saturate(0.8)`;
  if (s.fx === 'cold' || s.fx === 'mistc' || s.fx === 'rain' || s.fx === 'snow' || s.fx === 'coldrain') filt = 'saturate(0.6) brightness(0.85) hue-rotate(-8deg) contrast(1.05)';
  if (s.fx === 'warm') filt = 'sepia(0.15) saturate(1.1) brightness(1.03)';
  if (s.fx === 'rumi') filt = `brightness(${lerp(1, 0.6, ease(lt / 1.5))})`;
  if (s.fx === 'boom') { const sh = Math.max(0, 1 - lt / 0.6) * 26; ctx.save(); ctx.translate(Math.sin(t * 90) * sh, Math.cos(t * 77) * sh); }
  if (filt === 'none' && FLICK.has(s.k)) filt = `brightness(${(1 + 0.035 * Math.sin(t * 11) + 0.025 * Math.sin(t * 17.3)).toFixed(3)})`;
  drawImg(im || G[s.k], u, v, z, filt);
  if (s.fx === 'boom') ctx.restore();
  if (s.fx === 'motes') motes(t, 0.6);
  if (s.fx === 'rays' || s.fx === 'rumi') { godRays(t, 0.9); motes(t, 0.5); }
  if (s.fx === 'mist') { mist(t, 1); godRays(t, 0.5); }
  if (s.fx === 'mistc') mist(t, 1.2);
  if (s.fx === 'rain' || s.fx === 'coldrain') rain(t, s.fx === 'rain' ? 1 : 0.6);
  if (s.fx === 'snow') snow(t, 1);
  if (s.fx === 'end') { ctx.fillStyle = `rgba(5,6,18,${lerp(0.55, 0.8, ease(lt / 0.6))})`; ctx.fillRect(0, 0, W, H); motes(t, 0.6); }
  if (s.card) drawCard(s.card, lt, d, t);
}
function ytIcon(x, y, s, a) {
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#FF0033'; const w = s * 1.42, h = s; const r = h * 0.28;
  ctx.beginPath(); ctx.moveTo(x - w / 2 + r, y - h / 2); ctx.arcTo(x + w / 2, y - h / 2, x + w / 2, y + h / 2, r); ctx.arcTo(x + w / 2, y + h / 2, x - w / 2, y + h / 2, r); ctx.arcTo(x - w / 2, y + h / 2, x - w / 2, y - h / 2, r); ctx.arcTo(x - w / 2, y - h / 2, x + w / 2, y - h / 2, r); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - h * 0.17, y - h * 0.24); ctx.lineTo(x + h * 0.27, y); ctx.lineTo(x - h * 0.17, y + h * 0.24); ctx.fill(); ctx.restore();
}
function at(i, t) { return t - wt(i) + 0.1; }
function drawCard(c, lt, d, t) {
  const out = ease((d - lt) / 0.3);
  if (c === 'once') { ctx.save(); ctx.globalAlpha = out; cardText(['BİRKAÇ SAAT ÖNCE...'], lt - 0.1, { y: 960, size: 84, band: 0.35 }); ctx.restore(); }
  if (c === 'tapduk') cardText(['TAPDUK EMRE'], lt - 0.3, { y: 1680, size: 112, sub: 'MÜRŞİD · 13. YÜZYIL' });
  if (c === 'yunus') cardText(['YUNUS EMRE'], lt - 0.2, { y: 1680, size: 112, sub: 'DERVİŞ · ŞAİR · Ö. 1320' });
  if (c === 'cig') { const l2 = at(65, t); if (l2 > 0) { ctx.save(); const p = 1 + 0.25 * Math.max(0, 1 - l2 / 0.25); ctx.translate(W / 2, 470); ctx.scale(p, p); ctx.translate(-W / 2, -470); cardText(['HÂLÂ ÇİĞSİN!'], l2, { y: 470, size: 150, color: GOLD, fade: 0.12 }); ctx.restore(); } }
  if (c === 'yillar') cardText(['YILLAR GEÇER...'], lt - 0.3, { y: 900, size: 96, band: 0.35 });
